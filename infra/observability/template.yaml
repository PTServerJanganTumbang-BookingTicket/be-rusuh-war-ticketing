                    "rusuh-${Environment}-booking",
                    {
                      "stat": "Sum",
                      "id": "e2",
                      "visible": false
                    }
                  ],
                  [
                    {
                      "expression": "IF(i3 > 0, 100 * e3 / i3, 0)",
                      "id": "r3",
