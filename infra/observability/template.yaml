Outputs:
  DashboardUrl:
    Description: The sale dashboard.
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/rusuh-${Environment}-sale
  ApiDashboardUrl:
    Description: The API health dashboard (per route, per service).
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/rusuh-${Environment}-api
  AlarmTopicArn:
    Description: SNS topic every alarm notifies; add subscribers here.
    Value: !Ref AlarmTopic
