                      "visible": false
                    }
                  ],
                  [
                    {
                      "expression": "IF(i2 > 0, 100 * e2 / i2, 0)",
                      "id": "r2",
                      "label": "booking"
                    }
                  ],
                  [
                    "AWS/Lambda",
                    "Invocations",
