            },
            {
              "type": "metric",
              "x": 12,
              "y": 20,
              "width": 6,
              "height": 6,
              "properties": {
                "title": "Duration p95 per service",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 60,
                "metrics": [
