                    "rusuh-${Environment}-payment-api",
                    {
                      "stat": "Sum",
                      "id": "e3",
                      "visible": false
                    }
                  ],
                  [
                    {
                      "expression": "IF(i4 > 0, 100 * e4 / i4, 0)",
                      "id": "r4",
                      "label": "user"
                    }
                  ],
                  [
                    "AWS/Lambda",
                    "Invocations",
                    "FunctionName",
                    "rusuh-${Environment}-user",
                    {
                      "stat": "Sum",
                      "id": "i4",
                      "visible": false
                    }
                  ],
                  [
                    "AWS/Lambda",
                    "Errors",
                    "FunctionName",
                    "rusuh-${Environment}-user",
                    {
                      "stat": "Sum",
                      "id": "e4",
                      "visible": false
                    }
                  ],
                  [
                    {
                      "expression": "IF(i5 > 0, 100 * e5 / i5, 0)",
                      "id": "r5",
                      "label": "nik-verify"
                    }
                  ],
                  [
                    "AWS/Lambda",
