                    }
                  ],
                  [
                    "AWS/Lambda",
                    "Invocations",
                    "FunctionName",
                    "rusuh-${Environment}-queue",
                    {
                      "stat": "Sum",
                      "id": "i1",
                      "visible": false
                    }
                  ],
                  [
                    "AWS/Lambda",
