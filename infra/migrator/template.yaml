AWSTemplateFormatVersion: "2010-09-09"
Description: >
  rusuh migrator — a CodeBuild project that applies migrations/*.up.sql to
  Aurora from inside the VPC.

  WHY CODEBUILD, NOT THE CI RUNNER: Aurora has no public endpoint, so a
  GitHub-hosted runner cannot reach it. Something inside the VPC has to apply
  the migration. CodeBuild is the smallest thing that does, needs no Go
  toolchain or module proxy, and streams to CloudWatch where a failed
  migration can actually be read afterwards.

  WHY NOT AT SERVICE STARTUP: a few hundred concurrent Lambda cold starts
  would race to migrate. The pipeline runs this once, to completion, before
  deploying anything that reads the schema.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets with a route to the RDS Proxy

  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: >
      The Lambda security group, reused on purpose: it already holds the RDS
      Proxy ingress rule, so the migrator needs no new path to the database.

  VpcId:
    Type: AWS::EC2::VPC::Id

  DatabaseSecretArn:
    Type: String
    Description: Secrets Manager ARN holding the RDS Proxy connection string

Resources:
  # CI zips migrations/ plus the buildspec and uploads it here, then starts a
  # build against that exact key. Versioned so a build is reproducible from
  # the object it ran against.
  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub rusuh-${Environment}-migrator-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldSources
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpirationInDays: 30

  MigratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/rusuh-${Environment}-migrator
      RetentionInDays: 30

  MigratorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MigratorPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${MigratorLogGroup.Arn}:*"
              - Sid: ReadSource
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "${SourceBucket.Arn}/*"
              # CodeBuild resolves the SECRETS_MANAGER environment variable
              # below using THIS role, before the container starts. That is
              # why the image needs neither the AWS CLI nor a JSON parser.
              - Sid: ReadDatabaseSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
              - Sid: VpcNetworking
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeDhcpOptions
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                Resource: "*"
              # Scoped to interfaces CodeBuild itself creates, which is the
              # narrowest form AWS documents for this permission.
              - Sid: AttachNetworkInterface
                Effect: Allow
                Action: ec2:CreateNetworkInterfacePermission
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                Condition:
                  StringEquals:
                    ec2:AuthorizedService: codebuild.amazonaws.com

  MigratorProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub rusuh-${Environment}-migrator
      Description: Applies migrations/*.up.sql to Aurora from inside the VPC
      ServiceRole: !GetAtt MigratorRole.Arn
      TimeoutInMinutes: 20
      Source:
        Type: S3
        Location: !Sub "${SourceBucket}/source.zip"
        BuildSpec: buildspec.yml
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        # The official Postgres image, for psql. Debian-based rather than
        # Alpine: the CodeBuild agent expects glibc.
        Image: public.ecr.aws/docker/library/postgres:16
        ImagePullCredentialsType: CODEBUILD
        EnvironmentVariables:
          # Resolved by CodeBuild via MigratorRole before the container runs,
          # and masked in the build log.
          - Name: DATABASE_URL
            Type: SECRETS_MANAGER
            Value: !Sub "${DatabaseSecretArn}:url"
      VpcConfig:
        VpcId: !Ref VpcId
        Subnets: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref MigratorLogGroup

Outputs:
  ProjectName:
    Description: Pass to `aws codebuild start-build --project-name`
    Value: !Ref MigratorProject
  SourceBucketName:
    Description: CI uploads the migration bundle here
    Value: !Ref SourceBucket
