AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Seed Lambda — runs pkg/seed against Aurora and ElastiCache from inside the VPC.
  For development/setup only. Delete this stack after seeding.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

  LambdaS3Bucket:
    Type: String
    Description: S3 bucket containing the Lambda zip

  LambdaS3Key:
    Type: String
    Description: S3 key of the Lambda zip (bootstrap.zip)

  VpcSubnetIds:
    Type: AWS::SSM::Parameter::Value<List<AWS::EC2::Subnet::Id>>
    Default: /rusuh/prod/vpc/private-subnet-ids

  VpcSecurityGroupIds:
    Type: AWS::SSM::Parameter::Value<List<AWS::EC2::SecurityGroup::Id>>
    Default: /rusuh/prod/vpc/lambda-security-group-ids

  DatabaseSecretArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /rusuh/prod/db/secret-arn

  RedisAddr:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /rusuh/prod/redis/addr

Resources:
  SeedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub rusuh-${Environment}-seed-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: SecretsAndLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/rusuh-${Environment}-seed:*

  SeedLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/rusuh-${Environment}-seed
      RetentionInDays: 7

  SeedFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub rusuh-${Environment}-seed
      Description: "DEBUG ONLY — seeds Aurora + Redis with sample events. Delete after use."
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      Role: !GetAtt SeedRole.Arn
      Timeout: 120
      MemorySize: 256
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref VpcSecurityGroupIds
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      Environment:
        Variables:
          DATABASE_URL: !Sub '{{resolve:secretsmanager:rusuh-${Environment}/database-url:SecretString:url}}'
          REDIS_ADDR: !Ref RedisAddr
          REDIS_CLUSTER: "false"
          SEED_ALLOW_REMOTE: "1"

Outputs:
  FunctionName:
    Value: !Ref SeedFunction

  UsageExamples:
    Value: !Sub |
      # Seed (upsert only — safe to run multiple times)
      aws lambda invoke --function-name rusuh-${Environment}-seed \
        --region ${AWS::Region} --cli-binary-format raw-in-base64-out \
        --payload '{}' /tmp/out.json > /dev/null && cat /tmp/out.json | jq .

      # Reset Redis keys then seed (use when re-seeding after a sale)
      aws lambda invoke --function-name rusuh-${Environment}-seed \
        --region ${AWS::Region} --cli-binary-format raw-in-base64-out \
        --payload '{"reset":true}' /tmp/out.json > /dev/null && cat /tmp/out.json | jq .

      # Delete stack when done
      aws cloudformation delete-stack --stack-name rusuh-${Environment}-seed --region ${AWS::Region}
