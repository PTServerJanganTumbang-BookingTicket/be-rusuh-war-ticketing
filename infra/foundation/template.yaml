AWSTemplateFormatVersion: "2010-09-09"
Description: >
  rusuh foundation — VPC, Aurora PostgreSQL + RDS Proxy, ElastiCache Redis and
  the shared secrets. Everything the five service stacks take as parameters is
  created here and published as stack Outputs; the CD pipeline reads those
  Outputs and passes them through as --parameter-overrides.

  Deployed rarely and on its own. It owns all stateful resources, so its
  removal policies are deliberately stricter than the service stacks'.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: Suffixes every resource name so two environments can share an account.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

  DatabaseName:
    Type: String
    Default: rusuh

  DatabasePassword:
    Type: String
    Default: ""
    NoEcho: true
    MaxLength: 64
    # Alphanumeric only, and enforced rather than documented: this password is
    # embedded verbatim in a connection URL that CloudFormation cannot
    # percent-encode. A '?' or '#' in it silently corrupts the DSN into
    # something that parses as host "rusuh_app" with the password as a port,
    # and every service with a database dies at init. Rejecting it here costs
    # one failed change set; allowing it costs a deploy, a rollback and an
    # afternoon.
    AllowedPattern: '^$|^[A-Za-z0-9]{16,64}$'
    ConstraintDescription: >
      must be empty, or 16-64 characters of letters and digits only. No
      punctuation: it goes into a URL unescaped.
    Description: >
      Aurora master password. EMPTY (the default) generates a strong random
      one, which is the right choice for anything real - read it back with

        aws secretsmanager get-secret-value --secret-id rusuh-<env>/aurora-master

      Set it only when a team needs a shared, memorable credential for a SQL
      client during a POC. It is NoEcho, so it does not appear in stack events
      or describe-stacks, but it is still stored in Secrets Manager and
      readable by anyone who can read that secret.

  DatabaseUsername:
    Type: String
    Default: rusuh_app
    Description: Master user. The password is generated into Secrets Manager, never templated.

  # Aurora Serverless v2 scales between these. 0.5 ACU is the floor AWS allows
  # and is what an idle preprod costs; the ceiling is what absorbs the batch
  # GRANTED inserts during a sale.
  MinAuroraCapacity:
    Type: Number
    Default: 0.5
  MaxAuroraCapacity:
    Type: Number
    Default: 4

  CostOptimized:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      POC cost mode. true: Aurora scales to 0 ACU and auto-pauses, the RDS
      Proxy is not created, backups keep one day. false: a 0.5 ACU floor that
      never pauses, plus the proxy. See the cost table in DEPLOY.md.

  SingleAz:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Run every workload in ONE availability zone. Removes cross-AZ data
      transfer (billed both directions) and keeps the whole request path in
      one zone. The tradeoff is explicit: losing that zone takes the POC with
      it, and nothing fails over.

      NOTE: the RDS subnet group still spans two AZs because RDS requires it
      ("Each DB subnet group must have subnets in at least two Availability
      Zones"). Only the INSTANCE is pinned to one zone, which is what the
      billing and the latency follow.

  EnableNatGateway:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      A NAT gateway is the largest fixed line item here. It is needed for
      egress to SES, Dukcapil and Midtrans. Set false only when Dukcapil runs
      in mock mode and no email is sent, because nothing in a private subnet
      reaches the internet without it.

  AutoPauseSeconds:
    Type: Number
    Default: 3600
    MinValue: 300
    MaxValue: 86400
    Description: >
      Idle time before Aurora pauses, when CostOptimized. Resuming takes
      roughly 15 seconds, which is longer than the booking and nik-verify
      Lambda timeouts, so the FIRST request after a pause can fail. One hour
      keeps it awake through a working session and lets it pause overnight;
      warm it before a demo (DEPLOY.md).

  DbPubliclyAccessible:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      POC convenience: give Aurora a public endpoint so developers can attach
      DBeaver directly, instead of tunnelling through a bastion.

      This puts PostgreSQL on the public internet, where port 5432 is scanned
      continuously, and this cluster holds nik_hmac and payment rows. The only
      things between an attacker and the data are the password and the CIDR
      allowlist below. Acceptable for a throwaway POC; set false before
      anything resembling production.

  DbAllowedCidr:
    Type: String
    Default: ""
    Description: >
      CIDR allowed to reach 5432 when the endpoint is public, e.g. the office
      range 203.0.113.0/24, one developer at 203.0.113.7/32, or 0.0.0.0/0 for
      anywhere.

      EMPTY MEANS NO PUBLIC INGRESS. That is deliberate: a forgotten value
      should fail closed with "cannot connect" rather than open the database
      to the world.

      0.0.0.0/0 is a supported POC choice - a team on changing home and mobile
      IP addresses cannot maintain an allowlist, and a database nobody can
      reach is not useful. Know what it costs: port 5432 open to the internet
      is found by scanners within minutes, and from then on the only thing
      between the data and the world is the master password. That password is
      generated by this stack and 30+ characters, which is why this is
      survivable at all - so never replace it with something memorable, and
      never create a second login with a weak password.

      The consequence that is not recoverable: do not load real NIKs or any
      other real personal data into a database in this state. A POC with
      synthetic data that gets scanned is an embarrassment; a POC with real
      identity numbers that gets scanned is a breach. See DEPLOY.md.

  RedisNodeType:
    Type: String
    Default: cache.t4g.micro
    Description: >
      POC sizing. ADR-005 §15 sizes production on operation throughput and
      Multi-AZ rather than memory — the 300k working set is only ~80MB.

  EmailFromAddress:
    Type: String
    Description: >
      Address the notification service sends from. The SES identity itself is
      NOT created here: domain verification needs DNS records that live outside
      this stack. Verify it once by hand, then pass it in.

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  IsCostOptimized: !Equals [!Ref CostOptimized, "true"]
  # The proxy and Aurora auto-pause are mutually exclusive in practice: the
  # proxy holds warm connections to the cluster, which keep it from ever
  # reaching an idle state.
  EnableProxy: !Equals [!Ref CostOptimized, "false"]
  EnableNat: !Equals [!Ref EnableNatGateway, "true"]
  IsSingleAz: !Equals [!Ref SingleAz, "true"]
  IsDbPublic: !Equals [!Ref DbPubliclyAccessible, "true"]
  # Fails closed: no allowlist entry, no public ingress rule.
  HasDbCidr: !Not [!Equals [!Ref DbAllowedCidr, ""]]
  HasDbPassword: !Not [!Equals [!Ref DatabasePassword, ""]]
  IsDbWideOpen: !Equals [!Ref DbAllowedCidr, "0.0.0.0/0"]

Resources:

  # ─────────────────────────────────────────────────────────────────────────
  #  NETWORK
  #  Two AZs because Aurora and ElastiCache both require a subnet group
  #  spanning at least two, even when running a single node.
  # ─────────────────────────────────────────────────────────────────────────
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      # Required: Lambda resolves the RDS Proxy and ElastiCache endpoints by
      # DNS name, and both are private-hosted-zone records.
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub rusuh-${Environment}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub rusuh-${Environment}

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub rusuh-${Environment}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub rusuh-${Environment}-public-b

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - Key: Name
          Value: !Sub rusuh-${Environment}-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - Key: Name
          Value: !Sub rusuh-${Environment}-private-b

  # One NAT gateway, not one per AZ. It is a POC cost decision and the
  # tradeoff is explicit: losing AZ A takes outbound egress with it until the
  # route is moved. Dukcapil and Midtrans are reached through this.
  NatEip:
    Type: AWS::EC2::EIP
    Condition: EnableNat
    DependsOn: AttachGateway
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: EnableNat
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub rusuh-${Environment}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateRoute:
    Type: AWS::EC2::Route
    Condition: EnableNat
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # A GATEWAY endpoint, which is free. S3 is on the cold-start path because
  # that is where the Lambda deployment package is fetched from.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # INTERFACE endpoints are billed per hour PER AZ, so this one costs about
  # $15/month across two AZs. At POC request volume the NAT data charge it
  # saves is cents, so it is created only when not cost-optimising. The
  # latency argument is real but secondary: it trims a few milliseconds off a
  # cold start that is already hundreds.
  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: EnableProxy
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      # Interface endpoints bill per AZ-hour, so one zone is half the price.
      SubnetIds: !If
        - IsSingleAz
        - [!Ref PrivateSubnetA]
        - [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  # ─────────────────────────────────────────────────────────────────────────
  #  SECURITY GROUPS
  #  Descriptions are ASCII only: CloudFormation validates GroupDescription
  #  against ^([a-zA-Z0-9. _\-:/()#,@[\]+=&;{}!$*])*$ and rejects en/em dashes.
  # ─────────────────────────────────────────────────────────────────────────
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda functions - egress to Aurora, Redis and the internet
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound to Dukcapil, Midtrans, SES and AWS APIs
      Tags:
        - Key: Name
          Value: !Sub rusuh-${Environment}-lambda

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: EnableProxy
    Properties:
      GroupDescription: Interface VPC endpoints - HTTPS from Lambda
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: HTTPS from Lambda
      Tags:
        - Key: Name
          Value: !Sub rusuh-${Environment}-vpce

  RdsProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: EnableProxy
    Properties:
      GroupDescription: RDS Proxy - Postgres from Lambda and the migrator
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub rusuh-${Environment}-rdsproxy

  AuroraSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora PostgreSQL - Postgres from the RDS Proxy only
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub rusuh-${Environment}-aurora

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache Redis - inbound from Lambda
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: Redis from Lambda
      Tags:
        - Key: Name
          Value: !Sub rusuh-${Environment}-redis

  # Ingress rules are separate resources because SG-to-SG references between
  # inline rules would be a circular dependency.
  RdsProxyIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: EnableProxy
    Properties:
      GroupId: !Ref RdsProxySecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: Postgres from Lambda

  RdsProxyEgressToAurora:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: EnableProxy
    Properties:
      GroupId: !Ref RdsProxySecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref AuroraSecurityGroup
      Description: Postgres to Aurora

  # Cost-optimised mode has no proxy, so the clients connect to the cluster
  # directly and this is the rule that lets them.
  AuroraIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: IsCostOptimized
    Properties:
      GroupId: !Ref AuroraSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: Postgres from Lambda and the migrator, no proxy in between

  # The only path from outside the VPC. Created ONLY when DbAllowedCidr is
  # set, so an unset value leaves the public endpoint unreachable rather than
  # open.
  AuroraIngressFromDevCidr:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasDbCidr
    Properties:
      GroupId: !Ref AuroraSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      CidrIp: !Ref DbAllowedCidr
      # Spelled out in the rule itself so it is legible to anyone reading the
      # security group in the console, not only to whoever ran the deploy.
      Description: !If
        - IsDbWideOpen
        - "Postgres from ANY address on the internet - POC only, synthetic data only"
        - "Postgres from the developer allowlist, POC only"

  AuroraIngressFromProxy:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: EnableProxy
    Properties:
      GroupId: !Ref AuroraSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref RdsProxySecurityGroup
      Description: Postgres from the RDS Proxy

  # ─────────────────────────────────────────────────────────────────────────
  #  SECRETS
  # ─────────────────────────────────────────────────────────────────────────

  # The NIK pepper gets its own customer-managed key so that reading it is
  # auditable in CloudTrail separately from every other secret.
  #
  # ADR-005 §8 chose "pepper as a managed secret" over a KMS HMAC key with
  # GenerateMac precisely BECAUSE a managed secret can be restored from backup,
  # and §16 records that a lost pepper breaks BR-02 permanently. Rotation is
  # not available as a remediation either, so a leak is unrecoverable.
  #
  # Hence: RETAIN on both key and secret even in dev, and rotation disabled on
  # the key so nobody mistakes CMK rotation for pepper rotation.
  NikPepperKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub CMK for the rusuh-${Environment} NIK pepper. Loss breaks BR-02 permanently.
      EnableKeyRotation: false
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootPermissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

  NikPepperKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/rusuh-${Environment}-nik-pepper
      TargetKeyId: !Ref NikPepperKey

  NikPepperSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub rusuh-${Environment}/nik-pepper
      Description: HMAC pepper for NIK. NOT ROTATABLE - see ADR-005 section 8 and 16. Back this up.
      KmsKeyId: !Ref NikPepperKey
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # The JWT signing key is deliberately a DIFFERENT secret from the pepper and
  # on the account-default key: unlike the pepper, this one is rotatable, and
  # conflating them would make the rotatable thing unrotatable.
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub rusuh-${Environment}/jwt-signing
      Description: Access-token signing secret. Rotatable, unlike the NIK pepper.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  DukcapilApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub rusuh-${Environment}/dukcapil-api-key
      Description: Dukcapil API key. Populate by hand once the contract is signed.
      SecretString: '{"api_key":"REPLACE_ME"}'

  # Keys the guest device binding: a guest grant carries
  # device_hash = HMAC(DevicePepper, X-Device-Id), and payment-api recomputes
  # it to prove the browser presenting the grant is the one that earned it
  # (ADR-006 section 8.9).
  #
  # On the account-default key and with no DeletionPolicy, unlike the NIK
  # pepper, because this one IS rotatable - but only BETWEEN sales. Rotating it
  # mid-sale invalidates every live guest binding at once, and every guest
  # holding a grant gets 401 DEVICE_MISMATCH with no way back.
  #
  # Generated, not placeholdered: there is no external party to agree a value
  # with, and an unpopulated secret here fails every guest checkout.
  DevicePepperSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub rusuh-${Environment}/device-pepper
      Description: >
        HMAC pepper for the guest device binding. Rotatable BETWEEN sales only
        - rotating during one breaks every live guest grant.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # Authenticates charge calls to the Core API (HTTP Basic). It no longer
  # verifies notifications: Midtrans split signing off into a separate
  # Signature Secret Key on 28 October 2026 - see MidtransSignatureSecretKeySecret
  # below. A wrong value here stops new charges, so no customer is ever handed
  # an instrument to pay.
  #
  # Placeholdered rather than generated: Midtrans issues this, it cannot be
  # invented here. Populate it by hand from the Midtrans dashboard - sandbox
  # key for a POC, production key for a real sale - before the first charge.
  MidtransServerKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub rusuh-${Environment}/midtrans-server-key
      Description: >
        Midtrans Core API server key. Authenticates charges only; notification
        signatures use the separate signature secret key. Seeded by the
        pipeline from the MIDTRANS_SERVER_KEY GitHub secret.
      SecretString: '{"server_key":"REPLACE_ME"}'

  # Verifies the signature_key on every notification:
  #   SHA512(order_id + status_code + gross_amount + SignatureSecretKey)
  #
  # A SEPARATE credential from the server key since Midtrans split the two on
  # 28 October 2026. For a merchant that integrated before that date both
  # dashboard values START OUT identical, so the server key appears to work in
  # this slot and stops the moment either is regenerated - and server keys now
  # carry expiry dates, so that is scheduled maintenance rather than bad luck.
  #
  # While this is at REPLACE_ME the service starts, reports healthy, issues
  # virtual accounts and takes the customer's money, then rejects every
  # callback as a forgery: no booking confirmed, and the sweep resells the
  # seats. The symptom is indistinguishable from Midtrans never calling.
  #
  # Placeholdered rather than generated: Midtrans issues this, it cannot be
  # invented here.
  MidtransSignatureSecretKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub rusuh-${Environment}/midtrans-signature-secret-key
      Description: >
        Midtrans notification signature secret key. Verifies signature_key on
        every callback. Seeded by the pipeline from the
        MIDTRANS_SIGNATURE_SECRET_KEY GitHub secret.
      SecretString: '{"signature_secret_key":"REPLACE_ME"}'

  AuroraMasterSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub rusuh-${Environment}/aurora-master
      Description: Aurora master credentials. Consumed by the RDS Proxy, not by services.
      # Exactly one of these applies; the other resolves to AWS::NoValue.
      # SecretString and GenerateSecretString are mutually exclusive.
      SecretString: !If
        - HasDbPassword
        - !Sub '{"username":"${DatabaseUsername}","password":"${DatabasePassword}"}'
        - !Ref AWS::NoValue
      GenerateSecretString: !If
       - HasDbPassword
       - !Ref AWS::NoValue
       - SecretStringTemplate: !Sub '{"username":"${DatabaseUsername}"}'
         GenerateStringKey: password
         PasswordLength: 40
         # Alphanumeric only. This password is embedded verbatim in a URL by
         # AppDatabaseSecret below, and CloudFormation has no way to percent-
         # encode it, so any character with meaning in a URL corrupts the DSN.
         #
         # The previous version excluded a hand-picked list ("@/\ '` ) and was
         # still wrong: it allowed '?' and '#', either of which terminates the
         # authority. A password containing one produced
         #
         #   postgres://rusuh_app:PREF#IX@host:5432/db
         #
         # which parses as host "rusuh_app", port "PREF" - so every service
         # with a database died at init with "invalid port ... after host",
         # naming neither the password nor the secret. It also only showed up
         # when the generator happened to pick one of those two characters, so
         # it would have looked intermittent across environments.
         #
         # Excluding all punctuation removes the class of bug rather than the
         # two known members. 40 alphanumerics is ~238 bits, well above the 32
         # mixed-character ones it replaces.
         ExcludePunctuation: true

  # ─────────────────────────────────────────────────────────────────────────
  #  AURORA + RDS PROXY
  # ─────────────────────────────────────────────────────────────────────────
  # Two subnets either way: RDS rejects a subnet group that does not span two
  # availability zones ("DB Subnet Group doesn't meet availability zone
  # coverage requirement"). The group says where the instance MAY live;
  # AuroraInstance pins where it actually does.
  #
  # A public endpoint requires subnets whose route table reaches the internet
  # gateway, so the group switches to the public subnets. Lambda in the
  # private subnets still reaches it: that traffic stays inside the VPC and is
  # governed by the security group, not by the route table.
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub rusuh-${Environment} database subnets
      SubnetIds: !If
        - IsDbPublic
        - [!Ref PublicSubnetA, !Ref PublicSubnetB]
        - [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            # W1011 "use a dynamic reference rather than a parameter for a
            # secret" is good advice that is wrong here, and expensively so.
            #
            # A dynamic reference resolves when the change set is created,
            # before any resource in it is updated. Using one for
            # MasterUserPassword means the cluster is set from the password as
            # it was BEFORE the deploy, so the secret, the connection string
            # and the cluster each end up a generation apart. The symptom is
            # "password authentication failed", with every value looking
            # correct wherever you inspect it.
            #
            # The parameter is NoEcho and alphanumeric-constrained, and it is
            # only used when an operator deliberately sets one. When they do
            # not, the resolve below still applies - safe there, because a
            # generated password only changes on create.
            - W1011
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      EngineVersion: "16.15"
      EngineMode: provisioned
      DatabaseName: !Ref DatabaseName
      MasterUsername: !Sub '{{resolve:secretsmanager:${AuroraMasterSecret}:SecretString:username}}'
      # From the parameter when one was given, for the same reason as
      # AppDatabaseSecret: a dynamic reference resolves when the change set is
      # created, which is BEFORE AuroraMasterSecret is updated in that same
      # operation. Resolving here would set the cluster to the password from
      # before the deploy - so the secret, the DSN and the cluster would each
      # be a different generation, and the symptom is
      #
      #   FATAL: password authentication failed for user "rusuh_app"
      #
      # with every value looking correct wherever you inspect it.
      MasterUserPassword: !If
        - HasDbPassword
        - !Ref DatabasePassword
        - !Sub '{{resolve:secretsmanager:${AuroraMasterSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds:
        - !Ref AuroraSecurityGroup
      # MinCapacity 0 lets the cluster pause entirely. Storage is still
      # billed (cents at POC size) but ACU billing stops, which removes the
      # largest idle cost in this stack.
      ServerlessV2ScalingConfiguration: !If
        - IsCostOptimized
        - MinCapacity: 0
          MaxCapacity: !Ref MaxAuroraCapacity
          SecondsUntilAutoPause: !Ref AutoPauseSeconds
        - MinCapacity: !Ref MinAuroraCapacity
          MaxCapacity: !Ref MaxAuroraCapacity
      StorageEncrypted: true
      # Point-in-time recovery. ADR-005 accepts an RPO of zero for paid data,
      # so the backup window is not optional.
      BackupRetentionPeriod: !If [IsCostOptimized, 1, 7]
      DeletionProtection: !If [IsProd, true, false]
      EnableCloudwatchLogsExports:
        - postgresql

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: !If [IsDbPublic, true, false]
      # Pinned to the same zone as the Lambdas and Redis, so no request in the
      # hot path crosses an AZ boundary. Public and private subnet A are both
      # AZ index 0, so this holds in either mode. Omitted for multi-AZ, where
      # RDS places it.
      AvailabilityZone: !If
        - IsSingleAz
        - !Select [0, !GetAZs ""]
        - !Ref AWS::NoValue

  RdsProxyRole:
    Type: AWS::IAM::Role
    Condition: EnableProxy
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadMasterSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AuroraMasterSecret

  # The RDS Proxy is not a nicety here, it is what makes VPC Lambda and
  # Postgres compatible at all. Every warm execution environment holds its own
  # pool, so a few hundred concurrent Lambdas open a few hundred times
  # DATABASE_MAX_CONNS connections and exhaust the cluster. The proxy
  # multiplexes them onto a small real pool.
  RdsProxy:
    Type: AWS::RDS::DBProxy
    Condition: EnableProxy
    Properties:
      DBProxyName: !Sub rusuh-${Environment}
      EngineFamily: POSTGRESQL
      RoleArn: !GetAtt RdsProxyRole.Arn
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !Ref AuroraMasterSecret
          IAMAuth: DISABLED
      # Two subnets unconditionally: the proxy, like the RDS subnet group,
      # requires more than one AZ. It is only created in full mode anyway.
      VpcSubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      VpcSecurityGroupIds:
        - !Ref RdsProxySecurityGroup
      RequireTLS: true
      # Longer than the longest Lambda timeout (60s, outbox-publisher) so a
      # borrowed connection is not reclaimed mid-transaction.
      IdleClientTimeout: 300

  RdsProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Condition: EnableProxy
    Properties:
      DBProxyName: !Ref RdsProxy
      TargetGroupName: default
      DBClusterIdentifiers:
        - !Ref AuroraCluster
      ConnectionPoolConfigurationInfo:
        # Leave headroom on the cluster for the migrator and for psql sessions
        # during an incident.
        MaxConnectionsPercent: 90
        MaxIdleConnectionsPercent: 50
        ConnectionBorrowTimeout: 120

  # What the services actually receive: a ready-to-use connection string
  # pointing at the PROXY, not at the cluster. Services never see the master
  # secret, and the host can change without touching any service template.
  AppDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub rusuh-${Environment}/database-url
      Description: Postgres connection string via the RDS Proxy. This is what services read.
      # Host is the proxy when there is one and the cluster writer otherwise,
      # so no service template changes between the two modes.
      # Pass comes from the PARAMETER when one was given, not from resolving
      # the master secret.
      #
      # Dynamic references are resolved when the change set is CREATED, which
      # is before AuroraMasterSecret is updated in that same operation. So
      # resolving the secret here reads the value from before the deploy: set
      # a new password and this URL is written with the old one, every time,
      # however often you redeploy. That is exactly how rusuh-prod/database-url
      # kept a stale password while rusuh-prod/aurora-master had the new one.
      #
      # !Ref on a parameter has no such lag - the value is known while the
      # template is processed. The resolve below still applies when the
      # password is generated, where it is safe: a generated password only
      # ever changes on create, so there is nothing stale to read.
      SecretString: !Sub
        - '{"url":"postgres://${User}:${Pass}@${Host}:5432/${DatabaseName}?sslmode=require","host":"${Host}","port":"5432","dbname":"${DatabaseName}","username":"${User}"}'
        - User: !Sub '{{resolve:secretsmanager:${AuroraMasterSecret}:SecretString:username}}'
          Pass: !If
            - HasDbPassword
            - !Ref DatabasePassword
            - !Sub '{{resolve:secretsmanager:${AuroraMasterSecret}:SecretString:password}}'
          Host: !If
            - EnableProxy
            - !GetAtt RdsProxy.Endpoint
            - !GetAtt AuroraCluster.Endpoint.Address

  # ─────────────────────────────────────────────────────────────────────────
  #  ELASTICACHE REDIS
  # ─────────────────────────────────────────────────────────────────────────
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      CacheSubnetGroupName: !Sub rusuh-${Environment}
      Description: !Sub rusuh-${Environment} private subnets
      # ElastiCache, unlike RDS, accepts a single-subnet group.
      SubnetIds: !If
        - IsSingleAz
        - [!Ref PrivateSubnetA]
        - [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  # Single node in POC. Note what this costs architecturally: ADR-005 §11
  # describes a leader-lease failover scenario that depends on async replica
  # promotion, and with one node that scenario cannot be demonstrated at all.
  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      ClusterName: !Sub rusuh-${Environment}
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: !Ref RedisNodeType
      NumCacheNodes: 1
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      VpcSecurityGroupIds:
        - !Ref RedisSecurityGroup
      PreferredAvailabilityZone: !If
        - IsSingleAz
        - !GetAtt PrivateSubnetA.AvailabilityZone
        - !Ref AWS::NoValue
      # No AUTH token and no TLS: the cluster is unreachable outside the VPC,
      # and the Lua scripts in ADR-005 are latency-sensitive. Revisit for
      # production, where in-transit encryption should be on.
      AutoMinorVersionUpgrade: true

  # ─────────────────────────────────────────────────────────────────────────
  #  SES
  # ─────────────────────────────────────────────────────────────────────────
  # Without a configuration set a bouncing address is invisible, and SES
  # throttles the whole account for poor reputation before anyone notices.
  SesConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub rusuh-${Environment}
      ReputationOptions:
        ReputationMetricsEnabled: true

  # ─────────────────────────────────────────────────────────────────────────
  #  SSM PARAMETERS
  #
  #  The same values as the Outputs below, published where a service stack can
  #  resolve them ITSELF. A service declares
  #
  #    Type: AWS::SSM::Parameter::Value<List<AWS::EC2::Subnet::Id>>
  #    Default: /rusuh/prod/vpc/private-subnet-ids
  #
  #  and CloudFormation reads it at deploy time. That removes the whole
  #  read-outputs-and-pass-them-back dance from the pipeline: `sam deploy`
  #  needs no --parameter-overrides for infrastructure at all.
  #
  #  Standard-tier parameters are free, so this costs nothing.
  #
  #  Outputs are kept as well: they are what a human reads, and what the
  #  local deploy path in DEPLOY.md uses.
  # ─────────────────────────────────────────────────────────────────────────

  SsmPrivateSubnetIds:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/vpc/private-subnet-ids
      # StringList, because the consumer declares List<AWS::EC2::Subnet::Id>.
      # One entry in single-AZ mode, which is still a valid list.
      Type: StringList
      Value: !If
        - IsSingleAz
        - !Ref PrivateSubnetA
        - !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
      Description: Subnets for Lambda VpcConfig

  SsmAllPrivateSubnetIds:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/vpc/all-private-subnet-ids
      Type: StringList
      Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
      Description: Both subnets, for anything that needs two AZs

  SsmPublicSubnetIds:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/vpc/public-subnet-ids
      Type: StringList
      Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
      Description: Both public subnets, for the internet-facing ALB (an ALB needs two zones)

  SsmLambdaSecurityGroup:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/vpc/lambda-security-group-ids
      Type: StringList
      Value: !Ref LambdaSecurityGroup
      Description: Security group for Lambda VpcConfig

  SsmVpcId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/vpc/id
      Type: String
      Value: !Ref Vpc

  SsmDatabaseSecretArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/db/secret-arn
      Type: String
      # The ARN, not the secret. Reading it still needs IAM.
      Value: !Ref AppDatabaseSecret

  SsmNikPepperSecretArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/nik/pepper-secret-arn
      Type: String
      Value: !Ref NikPepperSecret

  SsmNikPepperKmsKeyArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/nik/pepper-kms-key-arn
      Type: String
      Value: !GetAtt NikPepperKey.Arn
      Description: Required for kms:Decrypt alongside GetSecretValue

  SsmJwtSecretArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/auth/jwt-secret-arn
      Type: String
      Value: !Ref JwtSecret

  SsmDukcapilApiKeySecretArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/dukcapil/api-key-secret-arn
      Type: String
      Value: !Ref DukcapilApiKeySecret

  SsmDevicePepperSecretArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/device/pepper-secret-arn
      Type: String
      Value: !Ref DevicePepperSecret

  SsmMidtransServerKeySecretArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/midtrans/server-key-secret-arn
      Type: String
      Value: !Ref MidtransServerKeySecret

  SsmMidtransSignatureSecretKeySecretArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/midtrans/signature-secret-key-secret-arn
      Type: String
      Value: !Ref MidtransSignatureSecretKeySecret

  # ── Midtrans webhook IP allowlist ───────────────────────────────────────
  #
  # ── Midtrans webhook IP allowlist ───────────────────────────────────────
  #
  # HTTP API Gateway (v2) does not support WAF or resource policies — only
  # REST APIs (v1) do. IP filtering must be enforced in the Lambda handler
  # itself. This parameter holds the authoritative allowlist; payment-api
  # reads it at startup via {{resolve:ssm:...}}.
  #
  # The value is a comma-separated list of CIDR blocks. Midtrans publishes
  # their IPs at https://docs.midtrans.com/docs/ip-address — sandbox and
  # production differ.
  #
  # IMPORTANT:
  # - This resource owns the parameter's EXISTENCE, not its contents. The
  #   placeholder value below is a valid CIDR that no real caller can match,
  #   so a forgotten update fails closed rather than opening the endpoint.
  # - Set the real CIDRs out of band after foundation deploys, then redeploy
  #   payment-api. The {{resolve:ssm:...}} is evaluated at deploy time, so
  #   editing the parameter alone does NOT affect running Lambdas.
  # - Outside local, an empty value makes payment-api refuse to start (fail
  #   closed by design). In local, an empty value disables the check.
  # - A rejection answers 200 (not 403) and surfaces as WebhookForbiddenIP
  #   metric, not as a failed request in access logs.
  SsmMidtransWebhookIPAllowlist:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/midtrans/webhook-ip-allowlist
      Type: String
      Value: "127.0.0.1/32"
      Description: >
        Comma-separated CIDR blocks; a single host is written /32.
        Get from https://docs.midtrans.com/docs/ip-address. The default
        placeholder (127.0.0.1/32) matches no real caller — set real values
        out of band after deploy, then redeploy payment-api.

  SsmRedisAddr:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/redis/addr
      Type: String
      Value: !Sub "${RedisCluster.RedisEndpoint.Address}:${RedisCluster.RedisEndpoint.Port}"

  # ── SAM build artifacts ─────────────────────────────────────────────────
  #
  # Replaces `sam deploy --resolve-s3`, which keeps its bucket in a
  # CloudFormation stack of its own and creates it lazily on first use. That
  # does not survive this pipeline: wave 1 deploys three services in parallel,
  # all three find the stack absent, all three try to create it, and the losers
  # fail with
  #
  #   Stack aws-sam-cli-managed-default ... not in a healthy state
  #   (Current state: REVIEW_IN_PROGRESS / ROLLBACK_IN_PROGRESS)
  #
  # Creating the bucket here removes the race entirely - it exists before any
  # service deploys, because preflight depends on this stack.
  SamArtifactBucket:
    Type: AWS::S3::Bucket
    # Build artifacts are reproducible; losing them costs one rebuild.
    DeletionPolicy: Delete
    Properties:
      # Deterministic, and globally unique via account + region.
      BucketName: !Sub rusuh-${Environment}-sam-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # The managed bucket has no lifecycle rule at all, so artifacts
          # accumulate forever - five services times every deploy. Thirty days
          # is longer than any rollback window that matters here.
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 30
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  SsmSamArtifactBucket:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/sam/artifact-bucket
      Type: String
      Description: S3 bucket the deploy pipeline uploads Lambda zips to
      Value: !Ref SamArtifactBucket

  SsmSesConfigurationSet:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/ses/configuration-set
      Type: String
      Value: !Ref SesConfigurationSet

  SsmEmailFromAddress:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/ses/from-address
      Type: String
      Value: !Ref EmailFromAddress

Outputs:
  PrivateSubnetIds:
    Description: >
      Pass to every service stack as VpcSubnetIds. One subnet in single-AZ
      mode, which is what keeps Lambda ENIs and the migrator in the same zone
      as Aurora and Redis.
    Value: !If
      - IsSingleAz
      - !Ref PrivateSubnetA
      - !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
  DeploymentAz:
    Description: The zone everything runs in when SingleAz is true
    Value: !If
      - IsSingleAz
      - !GetAtt PrivateSubnetA.AvailabilityZone
      - "multi-az"
  AllPrivateSubnetIds:
    Description: >
      Both private subnets regardless of mode. Needed by anything that
      requires two AZs even in a single-AZ deployment, such as the RDS Proxy.
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
  LambdaSecurityGroupId:
    Description: Pass to every service stack as SecurityGroupIds
    Value: !Ref LambdaSecurityGroup
  DatabaseSecretArn:
    Description: RDS Proxy connection string. Pass as DatabaseSecretArn.
    Value: !Ref AppDatabaseSecret
  NikPepperSecretArn:
    Value: !Ref NikPepperSecret
  NikPepperKmsKeyArn:
    Description: Required for kms:Decrypt. GetSecretValue alone cannot read a CMK-encrypted secret.
    Value: !GetAtt NikPepperKey.Arn
  JwtSecretArn:
    Value: !Ref JwtSecret
  DukcapilApiKeySecretArn:
    Value: !Ref DukcapilApiKeySecret
  DevicePepperSecretArn:
    Value: !Ref DevicePepperSecret
  MidtransServerKeySecretArn:
    Description: Populate by hand. Generated secrets cannot stand in for a gateway-issued key.
    Value: !Ref MidtransServerKeySecret
  RedisAddr:
    Description: host:port. Pass as RedisAddr.
    Value: !Sub "${RedisCluster.RedisEndpoint.Address}:${RedisCluster.RedisEndpoint.Port}"
  SesConfigurationSetName:
    Value: !Ref SesConfigurationSet
  EmailFromAddress:
    Value: !Ref EmailFromAddress
  VpcId:
    Value: !Ref Vpc
  AuroraClusterEndpoint:
    Description: >
      Cluster writer endpoint. Reachable from a developer machine only when
      DbPubliclyAccessible is true AND that machine is inside DbAllowedCidr.
    Value: !GetAtt AuroraCluster.Endpoint.Address
  AuroraPort:
    Value: !GetAtt AuroraCluster.Endpoint.Port
  DbAccessMode:
    Description: How the database can be reached
    Value: !If
      - IsDbPublic
      - !If
        - HasDbCidr
        - !If
          - IsDbWideOpen
          - "PUBLIC endpoint OPEN TO THE ENTIRE INTERNET (0.0.0.0/0) - POC only. Synthetic data only; the master password is the only control."
          - !Sub "PUBLIC endpoint, restricted to ${DbAllowedCidr} - POC only"
        - "PUBLIC endpoint but NO allowlist entry: nothing outside the VPC can connect. Set DbAllowedCidr."
      - "private: in-VPC only"
  SamArtifactBucketName:
    Description: Pass to sam deploy --s3-bucket. Also published to SSM.
    Value: !Ref SamArtifactBucket
  CostMode:
    Description: Which cost profile this stack was deployed with
    Value: !If
      - IsCostOptimized
      - "cost-optimised: Aurora pauses at 0 ACU, no RDS Proxy, 1-day backups"
      - "full: 0.5 ACU floor, RDS Proxy, 7-day backups"
