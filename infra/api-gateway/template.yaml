AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Unified API Gateway — single entry point for all rusuh services.
  Deploy this AFTER all service stacks are deployed.
  
  Frontend calls: https://<this-api>.execute-api.<region>.amazonaws.com
  
  Routes:
    /bookings/*  → booking service
    /events, /events/{event_id} → events service
    /events/{event_id}/tickets → booking service
    /events/{event_id}/queue/* → queue service (join, me)
    /payments/*  → payment service (methods, initiate, retry, status, handoff, exchange, webhook)
    /nik/*       → nik-verify service
    /auth/*      → user service
    /accounts/*  → user service
    /users/*     → user service
    /tickets/*   → user service
    /sys/ping    → booking service (health check)

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

Resources:
  # ============================================================================
  # HTTP API    
  # ============================================================================
  UnifiedApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub rusuh-${Environment}-api
      ProtocolType: HTTP
      Description: Unified API Gateway for all rusuh services
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Request-ID
          - Cookie
          - X-Grant-Token
          - X-Device-Id
          - X-Queue-Token
          - X-Payment-Session
        AllowCredentials: false
        MaxAge: 86400

  UnifiedApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/rusuh-${Environment}-api
      RetentionInDays: 14

  UnifiedApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref UnifiedApi
      StageName: $default
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt UnifiedApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationErrorMessage":"$context.integrationErrorMessage"}'

  # ============================================================================
  # Lambda Integrations
  # ============================================================================
  BookingIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref UnifiedApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:rusuh-${Environment}-booking
      PayloadFormatVersion: "2.0"

  NikVerifyIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref UnifiedApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:rusuh-${Environment}-nik-verify
      PayloadFormatVersion: "2.0"

  EventsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref UnifiedApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:rusuh-${Environment}-events
      PayloadFormatVersion: "2.0"

  NikVerifyIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref UnifiedApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:rusuh-${Environment}-nik-verify
      PayloadFormatVersion: "2.0"

  QueueIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref UnifiedApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:rusuh-${Environment}-queue
      PayloadFormatVersion: "2.0"

  UserIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref UnifiedApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:rusuh-${Environment}-user
      PayloadFormatVersion: "2.0"

  PaymentApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref UnifiedApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:rusuh-${Environment}-payment-api
      PayloadFormatVersion: "2.0"

  # ============================================================================
  # Lambda Permissions — allow this API Gateway to invoke the Lambdas
  # ============================================================================
  BookingPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Sub rusuh-${Environment}-booking
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApi}/*/*

  EventsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Sub rusuh-${Environment}-events
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApi}/*/*

  NikVerifyPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Sub rusuh-${Environment}-nik-verify
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApi}/*/*

  QueuePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Sub rusuh-${Environment}-queue
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApi}/*/*

  UserPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Sub rusuh-${Environment}-user
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApi}/*/*

  PaymentApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Sub rusuh-${Environment}-payment-api
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApi}/*/*

  # ============================================================================
  # Routes — Booking Service (/bookings/*)
  # ============================================================================
  RouteBookingsCreate:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: POST /bookings
      Target: !Sub integrations/${BookingIntegration}

  RouteBookingGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: GET /bookings/{booking_id}
      Target: !Sub integrations/${BookingIntegration}

  RouteTicketPage:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: GET /events/{event_id}/tickets
      Target: !Sub integrations/${BookingIntegration}

  # ============================================================================
  # Routes — Queue Service (/events/{event_id}/queue/*)
  # The stream (/queue/stream) and /queue/serving are not here: the SSE server runs on ECS behind its own ALB.
  # ============================================================================
  RouteQueueJoin:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: POST /events/{event_id}/queue/join
      Target: !Sub integrations/${QueueIntegration}

  RouteQueueMe:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: GET /events/{event_id}/queue/me
      Target: !Sub integrations/${QueueIntegration}

  # ============================================================================
  # Routes — NIK Verify Service (/nik/*)
  # ============================================================================
  RouteNikValidate:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: POST /nik/validate
      Target: !Sub integrations/${NikVerifyIntegration}

  # ============================================================================
  # Routes — User Service (/auth/*, /accounts/*, /users/*, /tickets/*)
  # ============================================================================
  
  # Auth routes
  RouteAuthMagicLink:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: POST /auth/magic-link
      Target: !Sub integrations/${UserIntegration}

  RouteAuthMagicLinkResend:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: POST /auth/magic-link/resend
      Target: !Sub integrations/${UserIntegration}

  RouteAuthVerify:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: GET /auth/verify
      Target: !Sub integrations/${UserIntegration}

  RouteAuthVerifyEmail:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: GET /auth/verify-email
      Target: !Sub integrations/${UserIntegration}

  RouteAuthRefresh:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: POST /auth/refresh
      Target: !Sub integrations/${UserIntegration}

  RouteAuthRegister:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: POST /auth/register
      Target: !Sub integrations/${UserIntegration}

  # Accounts routes
  # GET /accounts/me — the profile page (contract §1.8). Registered before the
  # saved-NIK routes only for readability: API Gateway matches the whole route
  # key, so "/accounts/me" and "/accounts/me/saved-niks" are two distinct
  # routes and neither shadows the other.
  RouteAccountsMe:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: GET /accounts/me
      Target: !Sub integrations/${UserIntegration}

  RouteAccountsSavedNiksGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: GET /accounts/me/saved-niks
      Target: !Sub integrations/${UserIntegration}

  RouteAccountsSavedNiksPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: POST /accounts/me/saved-niks
      Target: !Sub integrations/${UserIntegration}

  RouteAccountsSavedNikDelete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: DELETE /accounts/me/saved-niks/{id}
      Target: !Sub integrations/${UserIntegration}

  # Users routes
  RouteUsersMyTickets:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: GET /users/me/tickets
      Target: !Sub integrations/${UserIntegration}

  # Tickets routes
  RouteTicketEticket:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: GET /tickets/{ticket_id}/eticket
      Target: !Sub integrations/${UserIntegration}

  # ============================================================================
  # Routes — Payment Service (/payments/*)
  # ============================================================================
  # The first four sit behind the grant guard (X-Grant-Token, plus the account's
  # Bearer when the grant names one - ADR-006 §8.17). The gateway does not check
  # either; the service does.
  RoutePaymentMethods:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: GET /payments/{booking_id}/methods
      Target: !Sub integrations/${PaymentApiIntegration}

  RoutePaymentInitiate:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: POST /payments/{booking_id}
      Target: !Sub integrations/${PaymentApiIntegration}

  RoutePaymentRetry:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: POST /payments/{booking_id}/retry
      Target: !Sub integrations/${PaymentApiIntegration}

  RoutePaymentStatus:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: GET /payments/{booking_id}/status
      Target: !Sub integrations/${PaymentApiIntegration}

  # WebView payment handoff (ADR-007). The app mints a one-time code behind the
  # grant guard; the WebView page trades it for X-Payment-Session with no
  # guard, the code in the body being the credential.
  RoutePaymentCreateHandoff:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: POST /payments/{booking_id}/handoff
      Target: !Sub integrations/${PaymentApiIntegration}

  RoutePaymentExchangeHandoff:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: POST /payments/handoff/exchange
      Target: !Sub integrations/${PaymentApiIntegration}

  # Called by Midtrans, not by the frontend, and deliberately unauthenticated:
  # Midtrans has no credential to present, so the body's signature_key is the
  # authentication and the service verifies it before reading the payload.
  #
  # This is the route that makes settlement possible at all - it is the URL
  # pasted into the Midtrans dashboard as the Payment Notification URL. It
  # overlaps RoutePaymentInitiate (POST /payments/webhook also matches
  # POST /payments/{booking_id}), and HTTP API resolves that the right way: a
  # literal segment outranks a path variable.
  RoutePaymentWebhook:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: POST /payments/webhook
      Target: !Sub integrations/${PaymentApiIntegration}

  # Routes — Events Service (/events, /events/{event_id})
  # Public and cacheable: the handler sets Cache-Control. CloudFront in front of this API honours it.
  # ============================================================================
  RouteEventsList:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: GET /events
      Target: !Sub integrations/${EventsIntegration}

  RouteEventsGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: GET /events/{event_id}
      Target: !Sub integrations/${EventsIntegration}

  # ============================================================================
  # Routes — Health Check
  # ============================================================================
  RouteSysPing:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UnifiedApi
      RouteKey: GET /sys/ping
      Target: !Sub integrations/${BookingIntegration}

  # ============================================================================
  # SSM Parameter — so frontend can discover the URL
  # ============================================================================
  SsmApiUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/api/url
      Type: String
      Value: !Sub https://${UnifiedApi}.execute-api.${AWS::Region}.amazonaws.com
      Description: Unified API Gateway URL — use this for frontend

Outputs:
  ApiUrl:
    Description: |
      Unified API URL — Frontend should call this single URL.
      All routes are available here:
        GET  /events
        GET  /events/{event_id}
        GET  /events/{event_id}/tickets
        POST /events/{event_id}/queue/join
        GET  /events/{event_id}/queue/me
        POST /bookings
        GET  /bookings/{booking_id}
        POST /nik/validate
        POST /auth/magic-link
        POST /auth/magic-link/resend
        GET  /auth/verify
        GET  /auth/verify-email
        POST /auth/refresh
        POST /auth/register
        GET  /accounts/me
        GET  /accounts/me/saved-niks
        POST /accounts/me/saved-niks
        DELETE /accounts/me/saved-niks/{id}
        GET  /users/me/tickets
        GET  /tickets/{ticket_id}/eticket
        GET  /payments/{booking_id}/methods
        POST /payments/{booking_id}
        POST /payments/{booking_id}/retry
        GET  /payments/{booking_id}/status
        POST /payments/webhook
        GET  /sys/ping
    Value: !Sub https://${UnifiedApi}.execute-api.${AWS::Region}.amazonaws.com
    Export:
      Name: !Sub rusuh-${Environment}-api-url

  ApiId:
    Description: API Gateway ID
    Value: !Ref UnifiedApi
