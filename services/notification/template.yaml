AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: rusuh-notification — SQS to SES. Owns the notification queue and its DLQ.

Parameters:
  DeployRevision:
    Type: String
    Default: unset
    Description: >
      Commit SHA of the deploy that last touched this stack. Nothing reads it;
      it exists to force an update.

      CloudFormation does NOT detect changes behind a
      {{resolve:secretsmanager:...}} dynamic reference. If the template text is
      unchanged, the resource is not updated and the reference is never
      re-resolved - so rotating a secret leaves every Lambda running the value
      baked in at its last deploy, with no error anywhere and nothing in the
      console to suggest it is stale.

      Threading the commit SHA through makes every deploy a real change, so
      the secrets are re-read each time. The cost is that no service deploy is
      ever a no-op; that is the intended trade.

  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: >
      Suffixes every physical resource name. Without it the hardcoded names
      below collide and two environments cannot share an account and region.

  VpcSubnetIds:
    Type: AWS::SSM::Parameter::Value<List<AWS::EC2::Subnet::Id>>
    Default: /rusuh/prod/vpc/private-subnet-ids
    Description: Private subnets with reachability to Redis and the SES endpoint
  SecurityGroupIds:
    Type: AWS::SSM::Parameter::Value<List<AWS::EC2::SecurityGroup::Id>>
    Default: /rusuh/prod/vpc/lambda-security-group-ids
    Description: Security group permitting Redis (6379) egress
  RedisAddr:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /rusuh/prod/redis/addr
    Description: ElastiCache primary endpoint, host:port
  AppBaseUrl:
    Type: String
    Description: >
      Public FRONTEND base URL for emailed links. Not the API: the verify
      endpoint reads its token from a cookie, so the app route sets the cookie
      and then calls the API. Must be https — these links carry login tokens.
  EmailFromAddress:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /rusuh/prod/ses/from-address
    Description: Verified SES identity to send from
  SesConfigurationSet:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /rusuh/prod/ses/configuration-set
    Description: >
      SES configuration set routing bounces and complaints to SNS. Strongly
      recommended: without it a bouncing address is invisible and SES
      eventually throttles the account for poor reputation.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: provided.al2023
    Architectures:
      - arm64

Resources:
  # The DLQ is declared before the main queue it serves, so a message that
  # cannot be delivered is parked for inspection rather than retried forever.
  # NFR-10 requires exactly this: async with retry plus DLQ.
  NotificationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub rusuh-${Environment}-notification-dlq
      # Two weeks: long enough that a holiday weekend does not lose the
      # evidence of what failed.
      MessageRetentionPeriod: 1209600

  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub rusuh-${Environment}-notification
      # Six times the function timeout, per AWS guidance, so a slow send is
      # not redelivered while the first attempt is still running.
      VisibilityTimeout: 180
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDLQ.Arn
        # Five attempts. SES throttling is the common transient failure and
        # clears in seconds; beyond five the problem is not transient.
        maxReceiveCount: 5

  NotificationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub rusuh-${Environment}-notification
      Handler: bootstrap
      CodeUri: .
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Environment:
        Variables:
          DEPLOY_REVISION: !Ref DeployRevision
          APP_ENV: production
          APP_BASE_URL: !Ref AppBaseUrl
          REDIS_ADDR: !Ref RedisAddr
          EMAIL_FROM_ADDRESS: !Ref EmailFromAddress
          SES_CONFIGURATION_SET: !Ref SesConfigurationSet
          MAGIC_TOKEN_TTL_MINUTES: "15"
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            # Scoped to the one verified identity and the one configuration
            # set. Resource "*" here would let a misconfigured deploy send
            # from any identity in the account, with bounces going nowhere.
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource:
                - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*
                - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/*
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationQueue.Arn
            BatchSize: 10
            # Required for the handler's per-message failure report. Without
            # it, one failing message redelivers the whole batch and the other
            # nine recipients get a duplicate email.
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # Declared explicitly because SAM does not create it: Lambda would, on first
  # invoke, with retention set to NEVER EXPIRE. For a POC that is a slow leak
  # of storage cost with no upside.
  NotificationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/rusuh-${Environment}-notification
      RetentionInDays: 14

  # Published for services/outbox-publisher, which writes to this queue and
  # resolves both values from these paths.
  SsmQueueUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/notification/queue-url
      Type: String
      Value: !Ref NotificationQueue

  SsmQueueArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rusuh/${Environment}/notification/queue-arn
      Type: String
      Value: !GetAtt NotificationQueue.Arn

Outputs:
  QueueUrl:
    Description: URL of the notification queue — pass to outbox-publisher as NOTIFICATION_QUEUE_URL
    Value: !Ref NotificationQueue
  QueueArn:
    Description: ARN of the notification queue — pass to outbox-publisher as NotificationQueueArn
    Value: !GetAtt NotificationQueue.Arn
  DLQUrl:
    Description: URL of the dead-letter queue
    Value: !Ref NotificationDLQ
