AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: rusuh-outbox-publisher — drains the transactional outbox onto SQS

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: >
      Suffixes every physical resource name. Without it the hardcoded names
      below collide and two environments cannot share an account and region.

  VpcSubnetIds:
    Type: AWS::SSM::Parameter::Value<List<AWS::EC2::Subnet::Id>>
    Default: /rusuh/prod/vpc/private-subnet-ids
    Description: Private subnets with reachability to Aurora and Redis
  SecurityGroupIds:
    Type: AWS::SSM::Parameter::Value<List<AWS::EC2::SecurityGroup::Id>>
    Default: /rusuh/prod/vpc/lambda-security-group-ids
    Description: Security group permitting Aurora (5432) and Redis (6379) egress
  DatabaseSecretArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /rusuh/prod/db/secret-arn
    Description: Secrets Manager ARN holding the RDS Proxy connection string
  NotificationQueueArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /rusuh/prod/notification/queue-arn
    Description: ARN of the notification queue this publisher writes to
  NotificationQueueUrl:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /rusuh/prod/notification/queue-url
    Description: URL of the notification queue this publisher writes to
  RedisAddr:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /rusuh/prod/redis/addr
    Description: ElastiCache primary endpoint, host:port

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: provided.al2023
    Architectures:
      - arm64

Resources:
  OutboxPublisherFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub rusuh-${Environment}-outbox-publisher
      Handler: bootstrap
      CodeUri: .
      # One concurrent execution. More would not go faster — SKIP LOCKED lets
      # workers take disjoint slices, but every extra worker also holds a
      # database connection, and this is the fallback path, not the hot one.
      # Raise it only if OutboxLag stays non-zero between invocations.
      ReservedConcurrentExecutions: 1
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Environment:
        Variables:
          APP_ENV: production
          # ── Secrets, injected by CloudFormation at deploy time ──────────
          # The Go config loaders read these as PLAIN environment variables
          # (envutil.Env("DATABASE_URL") and friends) and validate() refuses to
          # start without them, so granting IAM to read the secret is not
          # enough - the value has to be here.
          #
          # Referenced by secret NAME, not by the ARN parameter above. The name
          # is deterministic from Environment, so !Sub substitutes a plain
          # parameter and the dynamic reference never depends on an
          # SSM-resolved value. The ARN parameters are still used, for the IAM
          # policies below.
          #
          # Resolved only on create/update: rotating a secret does NOT reach a
          # running function until its stack is updated again.
          DATABASE_URL: !Sub '{{resolve:secretsmanager:rusuh-${Environment}/database-url:SecretString:url}}'
          REDIS_ADDR: !Ref RedisAddr
          NOTIFICATION_QUEUE_URL: !Ref NotificationQueueUrl
          PUBLISH_BATCH_SIZE: "500"
          # EventBridge cannot schedule faster than once a minute, so each
          # invocation drains repeatedly inside this budget. Kept under the
          # 60s function timeout so the handler returns rather than being
          # killed mid-pass.
          DRAIN_BUDGET_SECONDS: "45"
          OUTBOX_LEASE_SECONDS: "30"
          DATABASE_MAX_CONNS: "4"
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref DatabaseSecretArn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !Ref NotificationQueueArn
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Description: Fallback drain; latency-sensitive effects run inline in their own services

  # Declared explicitly because SAM does not create it: Lambda would, on first
  # invoke, with retention set to NEVER EXPIRE. For a POC that is a slow leak
  # of storage cost with no upside.
  OutboxPublisherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/rusuh-${Environment}-outbox-publisher
      RetentionInDays: 14
