AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: rusuh-booking — native Lambda handler (Option B) behind API Gateway HTTP API

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: >
      Suffixes every physical resource name. Without it the hardcoded names
      below collide and two environments cannot share an account and region.


Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: provided.al2023
    Architectures:
      - arm64

Resources:
  BookingFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub rusuh-${Environment}-booking
      Handler: bootstrap
      CodeUri: .
      Events:
        CreateBooking:
          Type: HttpApi
          Properties:
            Path: /bookings
            Method: POST
        GetBooking:
          Type: HttpApi
          Properties:
            Path: /bookings/{booking_id}
            Method: GET
        HealthCheck:
          Type: HttpApi
          Properties:
            Path: /sys/ping
            Method: GET

  # Declared explicitly because SAM does not create it: Lambda would, on first
  # invoke, with retention set to NEVER EXPIRE. For a POC that is a slow leak
  # of storage cost with no upside.
  BookingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/rusuh-${Environment}-booking
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL of the booking HTTP API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
