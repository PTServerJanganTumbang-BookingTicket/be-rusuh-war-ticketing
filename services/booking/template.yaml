AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: rusuh-booking — Detail Ticket and booking endpoints (docs/05-booking) behind API Gateway HTTP API

Parameters:
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets with reachability to Aurora and Redis
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security group permitting Aurora (5432) and Redis (6379) egress
  DatabaseUrlSecretArn:
    Type: String
    Description: Secrets Manager secret holding the Aurora WRITER connection string
  DevicePepperSecretArn:
    Type: String
    Description: Secrets Manager secret holding DEVICE_PEPPER (the same secret rusuh-queue uses)
  ETicketSigningKeySecretArn:
    Type: String
    Description: Secrets Manager secret holding ETICKET_SIGNING_KEY (the same secret notification and rusuh-user use)
  RedisAddr:
    Type: String
    Description: ElastiCache (cluster mode) configuration endpoint, host:port

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: >
      Suffixes every physical resource name. Without it the hardcoded names
      below collide and two environments cannot share an account and region.


Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: provided.al2023
    Architectures:
      - arm64

Resources:
  BookingFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub rusuh-${Environment}-booking
      Handler: bootstrap
      CodeUri: .
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Environment:
        Variables:
          APP_ENV: production
          REDIS_ADDR: !Ref RedisAddr
          REDIS_CLUSTER: "true"
          DATABASE_MAX_CONNS: "2"
          MAX_TICKETS_PER_TRANSACTION: "3"
          DATABASE_URL: !Sub "{{resolve:secretsmanager:${DatabaseUrlSecretArn}}}"
          DEVICE_PEPPER: !Sub "{{resolve:secretsmanager:${DevicePepperSecretArn}}}"
          ETICKET_SIGNING_KEY: !Sub "{{resolve:secretsmanager:${ETicketSigningKeySecretArn}}}"
      Policies:
        - AWSLambdaVPCAccessExecutionRole
      # POST /bookings is added with build step B4.
      Events:
        BookingDetail:
          Type: HttpApi
          Properties:
            Path: /bookings/{booking_id}
            Method: GET
        TicketPage:
          Type: HttpApi
          Properties:
            Path: /events/{event_id}/tickets
            Method: GET
        HealthCheck:
          Type: HttpApi
          Properties:
            Path: /sys/ping
            Method: GET

  # Declared explicitly because SAM does not create it: Lambda would, on first
  # invoke, with retention set to NEVER EXPIRE. For a POC that is a slow leak
  # of storage cost with no upside.
  BookingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/rusuh-${Environment}-booking
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL of the booking HTTP API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
