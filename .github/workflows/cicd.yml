name: Golang CI/CD

on:
  push:
    branches: [ "main", "cicd", "test-deployment" ]
  pull_request:
    branches: [ "main", "cicd", "test-deployment" ]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment.
        type: choice
        options: [prod]
        default: prod
      deploy_foundation:
        description: >
          Also deploy infra/foundation (VPC, Aurora, Redis, secrets).
          Required on the very first deploy into an account.
        type: boolean
        default: false
      cost_optimized:
        description: >
          POC cost mode. Aurora scales to 0 ACU and auto-pauses.
        type: boolean
        default: true
      force_deploy:
        description: >
          Force deploy specific services regardless of changed files.
          Comma-separated: booking,queue,events,nik-verify,user,notification,outbox-publisher,ecs,all
          Use "all" to redeploy everything. Useful for reruns.
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      modules: ${{ steps.set.outputs.modules }}
      booking: ${{ steps.filter.outputs.booking }}
      queue: ${{ steps.filter.outputs.queue }}
      events: ${{ steps.filter.outputs.events }}
      user: ${{ steps.filter.outputs.user }}
      nik_verify: ${{ steps.filter.outputs.nik_verify }}
      notification: ${{ steps.filter.outputs.notification }}
      outbox_publisher: ${{ steps.filter.outputs.outbox_publisher }}
      payment_api: ${{ steps.filter.outputs.payment_api }}
      sse_server: ${{ steps.filter.outputs.sse_server }}
      admission_ctl: ${{ steps.filter.outputs.admission_ctl }}
      ecs_infra: ${{ steps.filter.outputs.ecs_infra }}
      pkg: ${{ steps.filter.outputs.pkg }}
      infra: ${{ steps.filter.outputs.infra }}
      api_gateway: ${{ steps.filter.outputs.api_gateway }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            pkg:
              - 'pkg/**'
              - 'go.work'
            booking:
              - 'services/booking/**'
              - 'pkg/**'
              - 'go.work'
            queue:
              - 'services/queue/**'
              - 'pkg/**'
              - 'go.work'
            events:
              - 'services/events/**'
              - 'pkg/**'
              - 'go.work'
            user:
              - 'services/user/**'
              - 'pkg/**'
              - 'go.work'
            nik_verify:
              - 'services/nik-verify/**'
              - 'pkg/**'
              - 'go.work'
            notification:
              - 'services/notification/**'
              - 'pkg/**'
              - 'go.work'
            outbox_publisher:
              - 'services/outbox-publisher/**'
              - 'pkg/**'
              - 'go.work'
            payment_api:
              - 'services/payment-api/**'
              - 'pkg/**'
              - 'go.work'
            sse_server:
              - 'services/sse-server/**'
              - 'pkg/**'
              - 'go.work'
            admission_ctl:
              - 'services/admission-ctl/**'
              - 'pkg/**'
              - 'go.work'
            infra:
              - 'infra/foundation/**'
            ecs_infra:
              - 'infra/ecs/**'
            api_gateway:
              - 'infra/api-gateway/**'
            migrations:
              - 'migrations/**'
              - 'infra/migrator/**'
      - id: set
        run: |
          FORCE="${{ inputs.force_deploy }}"
          mods=()

          # force_deploy=all overrides path detection entirely
          if [ "$FORCE" = "all" ]; then
            mods=("pkg" "services/booking" "services/queue" "services/events" "services/user" "services/nik-verify" "services/notification" "services/outbox-publisher" "services/payment-api" "services/sse-server" "services/admission-ctl")
          else
            if [ "${{ steps.filter.outputs.pkg }}" = "true" ]; then mods+=("pkg"); fi
            if [ "${{ steps.filter.outputs.booking }}" = "true" ] || echo "$FORCE" | grep -q "booking"; then mods+=("services/booking"); fi
            if [ "${{ steps.filter.outputs.queue }}" = "true" ] || echo "$FORCE" | grep -q "queue"; then mods+=("services/queue"); fi
            if [ "${{ steps.filter.outputs.events }}" = "true" ] || echo "$FORCE" | grep -q "events"; then mods+=("services/events"); fi
            if [ "${{ steps.filter.outputs.user }}" = "true" ] || echo "$FORCE" | grep -q "user"; then mods+=("services/user"); fi
            if [ "${{ steps.filter.outputs.nik_verify }}" = "true" ] || echo "$FORCE" | grep -q "nik-verify"; then mods+=("services/nik-verify"); fi
            if [ "${{ steps.filter.outputs.notification }}" = "true" ] || echo "$FORCE" | grep -q "notification"; then mods+=("services/notification"); fi
            if [ "${{ steps.filter.outputs.outbox_publisher }}" = "true" ] || echo "$FORCE" | grep -q "outbox-publisher"; then mods+=("services/outbox-publisher"); fi
            if [ "${{ steps.filter.outputs.payment_api }}" = "true" ] || echo "$FORCE" | grep -q "payment-api"; then mods+=("services/payment-api"); fi
            if [ "${{ steps.filter.outputs.sse_server }}" = "true" ]; then mods+=("services/sse-server"); fi
            if [ "${{ steps.filter.outputs.admission_ctl }}" = "true" ]; then mods+=("services/admission-ctl"); fi
          fi

          # Matrix must have at least one entry — fall back to pkg (fastest)
          if [ ${#mods[@]} -eq 0 ]; then mods+=("pkg"); fi
          json=$(printf '%s\n' "${mods[@]}" | jq -R . | jq -cs .)
          echo "modules=$json" >> "$GITHUB_OUTPUT"
          echo "matrix: $json"

  resolve-env:
    name: Resolve Deploy Target
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/cicd' ||
        github.ref == 'refs/heads/test-deployment'))
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      booking: ${{ steps.env.outputs.booking }}
      queue: ${{ steps.env.outputs.queue }}
      events: ${{ steps.env.outputs.events }}
      user: ${{ steps.env.outputs.user }}
      nik_verify: ${{ steps.env.outputs.nik_verify }}
      notification: ${{ steps.env.outputs.notification }}
      outbox_publisher: ${{ steps.env.outputs.outbox_publisher }}
      payment_api: ${{ steps.env.outputs.payment_api }}
      ecs: ${{ steps.env.outputs.ecs }}
      foundation_changed: ${{ needs.detect-changes.outputs.infra }}
      api_gateway_changed: ${{ needs.detect-changes.outputs.api_gateway }}
      any_service_changed: ${{ steps.env.outputs.any_service_changed }}
    steps:
      - id: env
        env:
          B: ${{ needs.detect-changes.outputs.booking }}
          Q: ${{ needs.detect-changes.outputs.queue }}
          V: ${{ needs.detect-changes.outputs.events }}
          U: ${{ needs.detect-changes.outputs.user }}
          N: ${{ needs.detect-changes.outputs.nik_verify }}
          T: ${{ needs.detect-changes.outputs.notification }}
          O: ${{ needs.detect-changes.outputs.outbox_publisher }}
          P: ${{ needs.detect-changes.outputs.payment_api }}
          S: ${{ needs.detect-changes.outputs.sse_server }}
          A: ${{ needs.detect-changes.outputs.admission_ctl }}
          E: ${{ needs.detect-changes.outputs.ecs_infra }}
          FORCE: ${{ inputs.force_deploy }}
        run: |
          set -eu
          environment="${{ inputs.environment || 'prod' }}"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

          # A service is "changed" if paths-filter detected it OR force_deploy includes it
          is_changed() {
            local flag="$1" name="$2"
            [ "$flag" = "true" ] && { echo "true"; return; }
            [ "$FORCE" = "all" ] && { echo "true"; return; }
            echo "$FORCE" | grep -q "$name" && { echo "true"; return; }
            echo "false"
          }

          b=$(is_changed "$B" "booking")
          q=$(is_changed "$Q" "queue")
          v=$(is_changed "$V" "events")
          u=$(is_changed "$U" "user")
          n=$(is_changed "$N" "nik-verify")
          t=$(is_changed "$T" "notification")
          o=$(is_changed "$O" "outbox-publisher")
          p=$(is_changed "$P" "payment-api")
          # The two ECS services deploy together (one stack, one image tag), so any of them, or the stack, rebuilds both.
          ecs=false
          for f in "$S" "$A" "$E"; do [ "$f" = "true" ] && ecs=true; done
          [ "$ecs" = "false" ] && ecs=$(is_changed false "ecs")

          echo "booking=$b"           >> "$GITHUB_OUTPUT"
          echo "queue=$q"             >> "$GITHUB_OUTPUT"
          echo "events=$v"            >> "$GITHUB_OUTPUT"
          echo "user=$u"              >> "$GITHUB_OUTPUT"
          echo "nik_verify=$n"        >> "$GITHUB_OUTPUT"
          echo "notification=$t"      >> "$GITHUB_OUTPUT"
          echo "outbox_publisher=$o"  >> "$GITHUB_OUTPUT"
          echo "payment_api=$p"       >> "$GITHUB_OUTPUT"
          echo "ecs=$ecs"              >> "$GITHUB_OUTPUT"

          any=false
          for f in "$b" "$q" "$v" "$u" "$n" "$t" "$o" "$p"; do
            [ "$f" = "true" ] && any=true
          done
          echo "any_service_changed=$any" >> "$GITHUB_OUTPUT"

          echo "environment        : $environment"
          echo "booking            : $b"
          echo "queue              : $q"
          echo "events             : $v"
          echo "user               : $u"
          echo "nik_verify         : $n"
          echo "notification       : $t"
          echo "outbox_publisher   : $o"
          echo "ecs                : $ecs"
          echo "any service changed: $any"

  golangci-lint:
    name: Lint (${{ matrix.module }})
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.SOURCE_REPO || github.repository }}
          ref: ${{ vars.SOURCE_REPO_BRANCH || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || 'main' }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
          args: --timeout=10m
        env:
          GOLANGCI_LINT_GO_VERSION_CHECK: "off"

  test:
    name: Test + Coverage (${{ matrix.module }})
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.SOURCE_REPO || github.repository }}
          ref: ${{ vars.SOURCE_REPO_BRANCH || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || 'main' }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          check-latest: true
      - name: Build (isolation check — no workspace)
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: off
        run: go build ./...
      - name: Run tests with coverage
        working-directory: ${{ matrix.module }}
        run: go test -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Name coverage report
        id: cov
        run: |
          name=$(echo "${{ matrix.module }}" | tr '/' '-')
          cp "${{ matrix.module }}/coverage.out" "$name.out"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ steps.cov.outputs.name }}
          path: ${{ steps.cov.outputs.name }}.out
      - name: Check code coverage (80% gate)
        working-directory: ${{ matrix.module }}
        # Gate on testable code only. Excluded from the denominator:
        #   cmd/    — func main() + process wiring, not unit-testable
        #   _mock/  — generated gomock code, never counts toward coverage
        #   pgtest/ — test-only Postgres helper (same exclusion as `make verify`)
        # The full profile is still uploaded above for Sonar; only the gate drops these.
        run: |
          grep -vE '/(cmd|_mock|pgtest)/' coverage.out > coverage.gate.out || cp coverage.out coverage.gate.out
          coverage=$(go tool cover -func=coverage.gate.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "Gate coverage ($(basename ${{ matrix.module }}), excl. cmd/ _mock/ pgtest/): $coverage%"
          awk -v c="$coverage" 'BEGIN { if (c+0 < 80) { print "Code coverage below threshold!"; exit 1 } }'

  govulncheck:
    name: Vuln Scan (${{ matrix.module }})
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.SOURCE_REPO || github.repository }}
          ref: ${{ vars.SOURCE_REPO_BRANCH || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || 'main' }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          check-latest: true
      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: off
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  hadolint:
    name: Lint Dockerfiles
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.booking == 'true' ||
      needs.detect-changes.outputs.user == 'true' ||
      needs.detect-changes.outputs.nik_verify == 'true' ||
      needs.detect-changes.outputs.outbox_publisher == 'true' ||
      needs.detect-changes.outputs.payment_api == 'true' ||
      needs.detect-changes.outputs.sse_server == 'true' ||
      needs.detect-changes.outputs.admission_ctl == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          recursive: true

  sonarqube:
    name: Sonarqube Checker
    needs: [golangci-lint, test, govulncheck]
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' &&
      vars.SONAR_HOST_URL != ''
    steps:
      # Checkout the SOURCE repo (where pkg/ and services/ actually live),
      # not the deploy repo (which only has infra templates).
      # SonarQube must scan the same files the coverage reports reference.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.SOURCE_REPO || github.repository }}
          ref: ${{ vars.SOURCE_REPO_BRANCH || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || 'main' }}
          fetch-depth: 0
      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: ./coverage
          merge-multiple: true
      - name: Collect coverage report paths
        id: cov
        run: |
          paths=$(ls coverage/*.out | paste -sd, -)
          echo "Coverage reports: $paths"
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@2500896589ef8f7247069a56136f8dc177c27ccf # v5.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.go.coverage.reportPaths=${{ steps.cov.outputs.paths }}

  quality-gate:
    name: Quality Gate
    needs: [golangci-lint, test, govulncheck, sonarqube]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require lint, test and vuln scan; tolerate a skipped Sonar
        run: |
          set -eu
          fail=0
          check() {
            case "$2" in
              success|skipped) echo "ok      $1 ($2)" ;;
              *)               echo "BLOCKED $1 ($2)"; fail=1 ;;
            esac
          }
          check golangci-lint "${{ needs.golangci-lint.result }}"
          check test          "${{ needs.test.result }}"
          check govulncheck   "${{ needs.govulncheck.result }}"
          check sonarqube     "${{ needs.sonarqube.result }}"
          [ "$fail" -eq 0 ] || { echo "Quality gate failed; not deploying."; exit 1; }

  # ══════════════════════════════════════════════════════════════════════════
  #  FOUNDATION (VPC, Aurora + RDS Proxy, Redis, secrets)
  #
  #  Deployed only when infra/foundation/** changes or when asked for by hand.
  #  NOTE: Foundation uses plain CloudFormation (no SAM transform), so it is
  #  NOT blocked by the SCP.
  # ══════════════════════════════════════════════════════════════════════════
  deploy-foundation:
    name: Deploy foundation
    needs: [resolve-env, quality-gate]
    if: >-
      always() &&
      needs.quality-gate.result == 'success' &&
      (needs.resolve-env.outputs.foundation_changed == 'true' ||
       inputs.deploy_foundation == true)
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Preflight — check for orphaned secrets that would block stack creation
        # Secrets with DeletionPolicy:Retain (and any secret pending deletion inside its
        # 30-day recovery window) keep their names taken in Secrets Manager. CloudFormation
        # will hit AlreadyExists, fail, and roll back — leaving the same debris behind.
        # This step fails fast with a clear fix rather than letting a 10-minute deploy do it.
        #
        # This check only matters when the foundation stack does NOT already exist (first-time
        # or retry after a failed create). If the stack is healthy the secrets belong to it
        # and their presence is expected.
        env:
          ENV: ${{ needs.resolve-env.outputs.environment }}
        run: |
          set -euo pipefail
          REGION="${{ vars.AWS_REGION }}"
          STACK="rusuh-${ENV}-foundation"

          # Skip the check when the stack is healthy — secrets belong to it.
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" --region "$REGION" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          HEALTHY_STATES="CREATE_COMPLETE UPDATE_COMPLETE UPDATE_ROLLBACK_COMPLETE"
          for s in $HEALTHY_STATES; do
            if [ "$STATUS" = "$s" ] && [ "$STATUS" != "UPDATE_ROLLBACK_COMPLETE" ]; then
              echo "Stack $STACK is $STATUS — skipping orphan check."
              exit 0
            fi
          done

          echo "Stack status: $STATUS — checking for orphaned secrets..."
          SECRETS=(
            "rusuh-${ENV}/nik-pepper"
            "rusuh-${ENV}/aurora-master"
            "rusuh-${ENV}/database-url"
            "rusuh-${ENV}/jwt-signing"
            "rusuh-${ENV}/device-pepper"
            "rusuh-${ENV}/dukcapil-api-key"
            "rusuh-${ENV}/midtrans-server-key"
            "rusuh-${ENV}/midtrans-signature-secret-key"
          )
          found=()
          for secret in "${SECRETS[@]}"; do
            if aws secretsmanager describe-secret \
                 --secret-id "$secret" --region "$REGION" \
                 >/dev/null 2>&1; then
              found+=("$secret")
            fi
          done

          if [ ${#found[@]} -gt 0 ]; then
            echo "::error::Orphaned secrets found that will block stack creation:"
            for s in "${found[@]}"; do echo "::error::  $s"; done
            echo "::error::Run ./infra/cleanup-failed-foundation.sh --yes and retry."
            exit 1
          fi
          echo "No orphaned secrets found — safe to deploy."
      - name: Deploy foundation stack
        env:
          ENV: ${{ needs.resolve-env.outputs.environment }}
          COST_OPTIMIZED: ${{ (github.event_name == 'workflow_dispatch' && inputs.cost_optimized == false) && 'false' || 'true' }}
          ENABLE_NAT: ${{ vars.ENABLE_NAT_GATEWAY || 'true' }}
          SINGLE_AZ: ${{ vars.SINGLE_AZ || 'true' }}
          DB_PUBLIC: ${{ vars.DB_PUBLICLY_ACCESSIBLE || 'true' }}
          DB_ALLOWED_CIDR: ${{ secrets.DB_ALLOWED_CIDR }}
          DB_MASTER_PASSWORD: ${{ secrets.DB_MASTER_PASSWORD }}
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --template-file infra/foundation/template.yaml \
            --stack-name "rusuh-${ENV}-foundation" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "Environment=${ENV}" \
              "EmailFromAddress=${{ vars.EMAIL_FROM_ADDRESS }}" \
              "CostOptimized=${COST_OPTIMIZED}" \
              "EnableNatGateway=${ENABLE_NAT}" \
              "SingleAz=${SINGLE_AZ}" \
              "DbPubliclyAccessible=${DB_PUBLIC}" \
              "DbAllowedCidr=${DB_ALLOWED_CIDR}" \
              "DatabasePassword=${DB_MASTER_PASSWORD}" \
            --tags Project=rusuh ManagedBy=github-actions

          aws cloudformation describe-stacks --stack-name "rusuh-${ENV}-foundation" \
            --query 'Stacks[0].Outputs[?OutputKey==`CostMode`].OutputValue' --output text
          echo -n "availability zone: "
          aws cloudformation describe-stacks --stack-name "rusuh-${ENV}-foundation" \
            --query 'Stacks[0].Outputs[?OutputKey==`DeploymentAz`].OutputValue' --output text
          echo -n "database access: "
          aws cloudformation describe-stacks --stack-name "rusuh-${ENV}-foundation" \
            --query 'Stacks[0].Outputs[?OutputKey==`DbAccessMode`].OutputValue' --output text

  # ══════════════════════════════════════════════════════════════════════════
  #  PREFLIGHT - Check SSM parameters exist
  # ══════════════════════════════════════════════════════════════════════════
  preflight:
    name: Preflight (SSM parameters)
    needs: [resolve-env, quality-gate, deploy-foundation]
    if: >-
      always() &&
      needs.quality-gate.result == 'success' &&
      needs.deploy-foundation.result != 'failure' &&
      needs.resolve-env.outputs.any_service_changed == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Repository variables must be consistent
        env:
          DUKCAPIL_MODE: ${{ vars.DUKCAPIL_MODE || 'stub' }}
          DUKCAPIL_BASE_URL: ${{ vars.DUKCAPIL_BASE_URL }}
          DUKCAPIL_EXTRA_HEADER_NAME: ${{ vars.DUKCAPIL_EXTRA_HEADER_NAME }}
          HAS_EXTRA_HEADER_VALUE: ${{ secrets.DUKCAPIL_EXTRA_HEADER_VALUE != '' }}
          # Booleans, not the values: preflight has no business holding either key.
          HAS_MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY != '' }}
          HAS_MIDTRANS_SIGNATURE_SECRET_KEY: ${{ secrets.MIDTRANS_SIGNATURE_SECRET_KEY != '' }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          NEEDS_NOTIFICATION: ${{ needs.resolve-env.outputs.notification }}
          NEEDS_PAYMENT_API: ${{ needs.resolve-env.outputs.payment_api }}
          ENV_NAME: ${{ needs.resolve-env.outputs.environment }}
          NEEDS_QUEUE: ${{ needs.resolve-env.outputs.queue }}
          NEEDS_BOOKING: ${{ needs.resolve-env.outputs.booking }}
          NEEDS_EVENTS: ${{ needs.resolve-env.outputs.events }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          DEVICE_PEPPER_SECRET_ARN: ${{ vars.DEVICE_PEPPER_SECRET_ARN }}
          TURNSTILE_SECRET_ARN: ${{ vars.TURNSTILE_SECRET_ARN }}
          ETICKET_SIGNING_KEY_SECRET_ARN: ${{ vars.ETICKET_SIGNING_KEY_SECRET_ARN }}
        run: |
          set -euo pipefail
          fail=0

          case "$DUKCAPIL_MODE" in
            live)
              if [ -z "$DUKCAPIL_BASE_URL" ]; then
                echo "::error::DUKCAPIL_MODE is live but DUKCAPIL_BASE_URL is empty."
                fail=1
              fi
              case "$DUKCAPIL_BASE_URL" in
                */verify)
                  echo "::error::DUKCAPIL_BASE_URL ends in /verify - remove it."
                  fail=1
                  ;;
                */)
                  echo "::error::DUKCAPIL_BASE_URL has trailing slash - remove it."
                  fail=1
                  ;;
              esac
              if [ -n "$DUKCAPIL_EXTRA_HEADER_NAME" ] && [ "$HAS_EXTRA_HEADER_VALUE" != "true" ]; then
                echo "::error::DUKCAPIL_EXTRA_HEADER_NAME set but DUKCAPIL_EXTRA_HEADER_VALUE secret is empty."
                fail=1
              fi
              ;;
            stub)
              echo "::warning::DUKCAPIL_MODE=stub - NIK verification is simulated."
              ;;
            *)
              echo "::error::DUKCAPIL_MODE must be 'live' or 'stub', got '$DUKCAPIL_MODE'."
              fail=1
              ;;
          esac

          if [ "$NEEDS_NOTIFICATION" = "true" ] && [ -z "$APP_BASE_URL" ]; then
            echo "::error::APP_BASE_URL is empty and notification is being deployed."
            fail=1
          fi
          if [ "$NEEDS_PAYMENT_API" = "true" ] && [ -z "$APP_BASE_URL" ]; then
            echo "::error::APP_BASE_URL is empty and payment-api is being deployed (payment_url is built on it)."
            fail=1
          fi

          # Not fatal, and deliberately not a value check: reading the secret
          # here would need GetSecretValue on the deploy role and would put a
          # payment credential one masking bug away from the build log.
          #
          # Worth a warning anyway, because the failure it causes is the worst
          # one this pipeline can ship. The secret is created by the foundation
          # stack holding REPLACE_ME; with that value the service starts,
          # charges nobody successfully, and rejects EVERY notification
          # Midtrans sends - so a customer pays and no ticket is ever issued.
          if [ "$NEEDS_PAYMENT_API" = "true" ]; then
            if [ "$HAS_MIDTRANS_SERVER_KEY" != "true" ]; then
              echo "::warning::MIDTRANS_SERVER_KEY secret is empty, so seed-payment-secrets will leave"
              echo "::warning::rusuh-${ENV_NAME}/midtrans-server-key as it is. If that is still REPLACE_ME,"
              echo "::warning::no charge can be authenticated and no customer can start paying."
            fi
            if [ "$HAS_MIDTRANS_SIGNATURE_SECRET_KEY" != "true" ]; then
              echo "::warning::MIDTRANS_SIGNATURE_SECRET_KEY secret is empty, so seed-payment-secrets will"
              echo "::warning::leave rusuh-${ENV_NAME}/midtrans-signature-secret-key as it is. If that is"
              echo "::warning::still REPLACE_ME the service runs, takes money, and rejects EVERY callback"
              echo "::warning::as a forgery - no booking confirmed and the seats resold."
            fi
            echo "::warning::payment-api is being deployed. Confirm the Midtrans dashboard's Payment"
            echo "::warning::Notification URL points at this stack's webhook path. Not checked here,"
            echo "::warning::and until it is set no settlement ever reaches the service."
          fi

          # Secrets Manager ARNs for the queue, booking and payment Lambdas. Missing or malformed values would only
          # show up as a failed CloudFormation deploy (or a Lambda that cannot start), so fail early with the name.
          check_arn() {
            local name="$1" value="$2"
            case "$value" in
              arn:aws:secretsmanager:*) ;;
              "") echo "::error::$name is empty (Secrets Manager secret ARN required)."; fail=1 ;;
              *)  echo "::error::$name is not a Secrets Manager ARN: '$value'."; fail=1 ;;
            esac
          }
          # Only the stacks that take these ARNs as parameters are checked. payment-api
          # needs the same device pepper (ADR-006 section 8.9) and the same JWT secret
          # (section 8.17), but its template resolves both by secret NAME - the name is
          # deterministic from Environment, so the dynamic reference does not depend on
          # an SSM-resolved value - and it is passed no ARN to validate. A mismatch
          # there surfaces as DEVICE_MISMATCH on every guest checkout, or 401 on every
          # logged-in payment, and nowhere else; see the open item in
          # docs/07-payment/06-grant-guard.md section 6.
          if [ "$NEEDS_QUEUE" = "true" ] || [ "$NEEDS_BOOKING" = "true" ]; then
            check_arn DEVICE_PEPPER_SECRET_ARN "$DEVICE_PEPPER_SECRET_ARN"
          fi
          if [ "$NEEDS_QUEUE" = "true" ]; then
            check_arn TURNSTILE_SECRET_ARN "$TURNSTILE_SECRET_ARN"
          fi
          if [ "$NEEDS_BOOKING" = "true" ]; then
            check_arn ETICKET_SIGNING_KEY_SECRET_ARN "$ETICKET_SIGNING_KEY_SECRET_ARN"
          fi

          if [ "$NEEDS_EVENTS" = "true" ] && [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo "::error::The GitHub secret TURNSTILE_SITE_KEY is empty and events is being deployed (public Turnstile site key, returned as captcha.site_key)."
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "Repository variables OK."

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check SSM parameters exist
        env:
          ENV: ${{ needs.resolve-env.outputs.environment }}
        run: |
          set -euo pipefail
          paths="
            /rusuh/${ENV}/vpc/private-subnet-ids
            /rusuh/${ENV}/vpc/lambda-security-group-ids
            /rusuh/${ENV}/db/secret-arn
            /rusuh/${ENV}/nik/pepper-secret-arn
            /rusuh/${ENV}/nik/pepper-kms-key-arn
            /rusuh/${ENV}/auth/jwt-secret-arn
            /rusuh/${ENV}/dukcapil/api-key-secret-arn
            /rusuh/${ENV}/device/pepper-secret-arn
            /rusuh/${ENV}/midtrans/server-key-secret-arn
            /rusuh/${ENV}/midtrans/signature-secret-key-secret-arn
            /rusuh/${ENV}/redis/addr
            /rusuh/${ENV}/ses/configuration-set
            /rusuh/${ENV}/ses/from-address
            /rusuh/${ENV}/sam/artifact-bucket
          "

          if [ "$ENV" != "prod" ]; then
            echo "::error::Environment is '$ENV' but templates resolve /rusuh/prod/... by default."
            exit 1
          fi

          missing=""
          for pth in $paths; do
            if aws ssm get-parameter --name "$pth" >/dev/null 2>&1; then
              echo "  ok      $pth"
            else
              echo "  MISSING $pth"
              missing="$missing $pth"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing SSM parameters:$missing"
            echo "::error::Deploy foundation first (workflow_dispatch with deploy_foundation=true)."
            exit 1
          fi
          echo "All infrastructure parameters present."

  # ══════════════════════════════════════════════════════════════════════════
  #  SECRET SEEDING — must finish before any stack that resolves these
  # ══════════════════════════════════════════════════════════════════════════
  #
  # The two Midtrans keys are the only secrets a human has to supply: every
  # other rusuh-* secret is either generated by the foundation or belongs to a
  # resource it creates. They are held as GitHub secrets and written here so a
  # rebuilt environment needs no manual step.
  #
  # This job runs BEFORE the deploy waves and that ordering is load-bearing.
  # CloudFormation resolves {{resolve:secretsmanager:...}} at DEPLOY time and
  # bakes the result into the Lambda's environment, so a value written after
  # the stack deploys does not reach the function until the next deploy. Seeded
  # afterwards, a correct key would still behave exactly like a wrong one.
  #
  # put-secret-value only, never create-secret: the foundation owns which
  # secrets exist, and a pipeline that can invent them hides a missing
  # foundation deploy behind a new empty secret.
  seed-payment-secrets:
    name: Seed Midtrans secrets
    needs: [resolve-env, preflight]
    if: >-
      always() && needs.preflight.result == 'success' &&
      needs.resolve-env.outputs.payment_api == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Write the Midtrans keys into Secrets Manager
        env:
          ENV: ${{ needs.resolve-env.outputs.environment }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          MIDTRANS_SIGNATURE_SECRET_KEY: ${{ secrets.MIDTRANS_SIGNATURE_SECRET_KEY }}
        run: |
          set -euo pipefail

          # An empty GitHub secret SKIPS rather than writes. Clearing or
          # renaming one would otherwise overwrite a working key with "", and
          # the service would then boot, report healthy and fail every payment
          # - the exact failure this job exists to prevent.
          seed() {
            local secret_id="$1" json_key="$2" value="$3" label="$4"

            if [ -z "$value" ]; then
              echo "::warning::$label is empty; leaving $secret_id unchanged."
              return 0
            fi

            # describe, not get-secret-value: confirms the secret exists
            # without this job ever reading a secret it did not bring.
            if ! aws secretsmanager describe-secret --secret-id "$secret_id" >/dev/null 2>&1; then
              echo "::error::$secret_id does not exist. Deploy the foundation first"
              echo "::error::(workflow_dispatch with deploy_foundation=true)."
              return 1
            fi

            # jq builds the JSON so the key never has to survive shell quoting,
            # and nothing echoes the value.
            aws secretsmanager put-secret-value \
              --secret-id "$secret_id" \
              --secret-string "$(jq -n --arg k "$json_key" --arg v "$value" '{($k): $v}')" \
              --query VersionId --output text >/dev/null

            echo "  seeded $secret_id ($json_key)"
          }

          fail=0
          seed "rusuh-${ENV}/midtrans-server-key" \
               server_key "$MIDTRANS_SERVER_KEY" MIDTRANS_SERVER_KEY || fail=1
          seed "rusuh-${ENV}/midtrans-signature-secret-key" \
               signature_secret_key "$MIDTRANS_SIGNATURE_SECRET_KEY" MIDTRANS_SIGNATURE_SECRET_KEY || fail=1

          [ "$fail" -eq 0 ]

  # ══════════════════════════════════════════════════════════════════════════
  #  WAVE 1 — Using cfn-deploy (raw CloudFormation, no SAM transform)
  #
  #  This bypasses the SCP that blocks cloudformation:CreateChangeSet on
  #  arn:aws:cloudformation:*:aws:transform/Serverless-2016-10-31
  # ══════════════════════════════════════════════════════════════════════════
  deploy-booking:
    name: Deploy booking
    needs: [resolve-env, preflight]
    if: always() && needs.preflight.result == 'success' && needs.resolve-env.outputs.booking == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/cfn-deploy
        with:
          service: booking
          stack-name: rusuh-${{ needs.resolve-env.outputs.environment }}-booking
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          environment: ${{ needs.resolve-env.outputs.environment }}
          parameter-overrides: >-
            Environment=${{ needs.resolve-env.outputs.environment }}
            EnableDirectApiAccess=${{ vars.ENABLE_DIRECT_API_ACCESS || 'false' }}
            DeployRevision=${{ github.sha }}
            DevicePepperSecretArn=${{ vars.DEVICE_PEPPER_SECRET_ARN }}
            ETicketSigningKeySecretArn=${{ vars.ETICKET_SIGNING_KEY_SECRET_ARN }}

  deploy-queue:
    name: Deploy queue
    needs: [resolve-env, preflight]
    if: always() && needs.preflight.result == 'success' && needs.resolve-env.outputs.queue == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/cfn-deploy
        with:
          service: queue
          stack-name: rusuh-${{ needs.resolve-env.outputs.environment }}-queue
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          environment: ${{ needs.resolve-env.outputs.environment }}
          parameter-overrides: >-
            Environment=${{ needs.resolve-env.outputs.environment }}
            EnableDirectApiAccess=${{ vars.ENABLE_DIRECT_API_ACCESS || 'false' }}
            DeployRevision=${{ github.sha }}
            DevicePepperSecretArn=${{ vars.DEVICE_PEPPER_SECRET_ARN }}
            TurnstileSecretArn=${{ vars.TURNSTILE_SECRET_ARN }}
            CookieDomain=${{ vars.COOKIE_DOMAIN }}
            SseBaseUrl=${{ vars.SSE_BASE_URL }}
            CaptchaProvider=${{ vars.CAPTCHA_PROVIDER || 'mock' }}
            QueueCapacity=${{ vars.QUEUE_CAPACITY || '300000' }}
            SaleWindowSeconds=${{ vars.SALE_WINDOW_SECONDS || '21600' }}

  deploy-events:
    name: Deploy events
    needs: [resolve-env, preflight]
    if: always() && needs.preflight.result == 'success' && needs.resolve-env.outputs.events == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/cfn-deploy
        with:
          service: events
          stack-name: rusuh-${{ needs.resolve-env.outputs.environment }}-events
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          environment: ${{ needs.resolve-env.outputs.environment }}
          parameter-overrides: >-
            Environment=${{ needs.resolve-env.outputs.environment }}
            EnableDirectApiAccess=${{ vars.ENABLE_DIRECT_API_ACCESS || 'false' }}
            DeployRevision=${{ github.sha }}
            TurnstileSiteKey=${{ secrets.TURNSTILE_SITE_KEY }}
            QueueCapacity=${{ vars.QUEUE_CAPACITY || '300000' }}

  deploy-nik-verify:
    name: Deploy nik-verify
    needs: [resolve-env, preflight]
    if: always() && needs.preflight.result == 'success' && needs.resolve-env.outputs.nik_verify == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/cfn-deploy
        with:
          service: nik-verify
          stack-name: rusuh-${{ needs.resolve-env.outputs.environment }}-nik-verify
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          environment: ${{ needs.resolve-env.outputs.environment }}
          parameter-overrides: >-
            Environment=${{ needs.resolve-env.outputs.environment }}
            EnableDirectApiAccess=${{ vars.ENABLE_DIRECT_API_ACCESS || 'false' }}
            DeployRevision=${{ github.sha }}
            DukcapilMode=${{ vars.DUKCAPIL_MODE || 'stub' }}
            DukcapilBaseUrl=${{ vars.DUKCAPIL_BASE_URL }}
            DukcapilExtraHeaderName=${{ vars.DUKCAPIL_EXTRA_HEADER_NAME }}
            DukcapilExtraHeaderValue=${{ secrets.DUKCAPIL_EXTRA_HEADER_VALUE }}

  deploy-notification:
    name: Deploy notification
    needs: [resolve-env, preflight]
    if: always() && needs.preflight.result == 'success' && needs.resolve-env.outputs.notification == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/cfn-deploy
        with:
          service: notification
          stack-name: rusuh-${{ needs.resolve-env.outputs.environment }}-notification
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          environment: ${{ needs.resolve-env.outputs.environment }}
          parameter-overrides: >-
            Environment=${{ needs.resolve-env.outputs.environment }}
            DeployRevision=${{ github.sha }}
            AppBaseUrl=${{ vars.APP_BASE_URL }}

  # payment-api is in wave 1 because it consumes nothing any other stack
  # publishes - only foundation's parameters. The webhook it exposes is called
  # by Midtrans, not by another service here.
  deploy-payment-api:
    name: Deploy payment-api
    needs: [resolve-env, preflight, seed-payment-secrets]
    # The seed must have SUCCEEDED, not merely not-failed: deploying over an
    # unseeded secret bakes REPLACE_ME into the function's environment.
    if: >-
      always() && needs.preflight.result == 'success' &&
      needs.seed-payment-secrets.result == 'success' &&
      needs.resolve-env.outputs.payment_api == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # cfn-deploy, not sam-deploy: an SCP denies CreateChangeSet on the
      # Serverless transform, so services/payment-api/template-cfn.yaml is the
      # deployed template. template.yaml stays as the SAM description.
      - uses: ./.github/actions/cfn-deploy
        with:
          service: payment-api
          stack-name: rusuh-${{ needs.resolve-env.outputs.environment }}-payment-api
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          environment: ${{ needs.resolve-env.outputs.environment }}
          # MIDTRANS_BASE_URL is passed rather than left to the template
          # default so that moving a POC to real money is a repo-variable
          # change with an audit trail, not a template edit. Unset means
          # sandbox: a forgotten variable charges nobody.
          #
          # The window and attempt limits stay on their template defaults -
          # they are product policy (BR-05), not per-environment wiring, and
          # the template constrains their ranges.
          parameter-overrides: >-
            Environment=${{ needs.resolve-env.outputs.environment }}
            EnableDirectApiAccess=${{ vars.ENABLE_DIRECT_API_ACCESS || 'false' }}
            DeployRevision=${{ github.sha }}
            MidtransBaseUrl=${{ vars.MIDTRANS_BASE_URL || 'https://api.sandbox.midtrans.com' }}
            PaymentIconBase=${{ vars.PAYMENT_ICON_BASE || 'https://cdn.rusuh.id/icons' }}
            AppBaseUrl=${{ vars.APP_BASE_URL }}
            PaymentWebPath=${{ vars.PAYMENT_WEB_PATH || '/m/orders/{booking_id}/pay' }}

  # ══════════════════════════════════════════════════════════════════════════
  #  WAVE 2 — Depends on Wave 1's SSM parameters
  # ══════════════════════════════════════════════════════════════════════════
  deploy-user:
    name: Deploy user
    needs: [resolve-env, preflight, deploy-nik-verify]
    if: >-
      always() && needs.preflight.result == 'success' &&
      needs.deploy-nik-verify.result != 'failure' &&
      needs.resolve-env.outputs.user == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/cfn-deploy
        with:
          service: user
          stack-name: rusuh-${{ needs.resolve-env.outputs.environment }}-user
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          environment: ${{ needs.resolve-env.outputs.environment }}
          parameter-overrides: >-
            Environment=${{ needs.resolve-env.outputs.environment }}
            EnableDirectApiAccess=${{ vars.ENABLE_DIRECT_API_ACCESS || 'false' }}
            DeployRevision=${{ github.sha }}
            CookieDomain=${{ vars.COOKIE_DOMAIN }}

  deploy-outbox-publisher:
    name: Deploy outbox-publisher
    needs: [resolve-env, preflight, deploy-notification]
    if: >-
      always() && needs.preflight.result == 'success' &&
      needs.deploy-notification.result != 'failure' &&
      needs.resolve-env.outputs.outbox_publisher == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/cfn-deploy
        with:
          service: outbox-publisher
          stack-name: rusuh-${{ needs.resolve-env.outputs.environment }}-outbox-publisher
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          environment: ${{ needs.resolve-env.outputs.environment }}
          parameter-overrides: >-
            Environment=${{ needs.resolve-env.outputs.environment }}
            DeployRevision=${{ github.sha }}

  # ══════════════════════════════════════════════════════════════════════════
  #  UNIFIED API GATEWAY — Single entry point for frontend
  #
  #  Deploys after all HTTP services (booking, queue, events, nik-verify, user) are up.
  #  Creates routes that proxy to the individual Lambda functions.
  # ══════════════════════════════════════════════════════════════════════════
  deploy-api-gateway:
    name: Deploy unified API gateway
    # payment-api is in this list because the gateway declares a Lambda
    # permission and an integration naming rusuh-${ENV}-payment-api: deploying
    # the gateway before that function exists fails the whole stack.
    needs: [resolve-env, deploy-booking, deploy-queue, deploy-events, deploy-nik-verify, deploy-user, deploy-payment-api]
    if: >-
      always() &&
      needs.deploy-booking.result != 'failure' &&
      needs.deploy-queue.result != 'failure' &&
      needs.deploy-events.result != 'failure' &&
      needs.deploy-nik-verify.result != 'failure' &&
      needs.deploy-user.result != 'failure' &&
      needs.deploy-payment-api.result != 'failure' &&
      (needs.resolve-env.outputs.any_service_changed == 'true' ||
       needs.resolve-env.outputs.api_gateway_changed == 'true')
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy unified API gateway
        env:
          ENV: ${{ needs.resolve-env.outputs.environment }}
        run: |
          aws cloudformation deploy \
            --template-file infra/api-gateway/template.yaml \
            --stack-name "rusuh-${ENV}-api" \
            --no-fail-on-empty-changeset \
            --parameter-overrides "Environment=${ENV}" \
            --tags Project=rusuh ManagedBy=github-actions

  # ══════════════════════════════════════════════════════════════════════════
  #  ECS - admission-ctl and sse-server (DEPLOY.md, ECS section)
  #  Not behind the API gateway and not part of the Lambda waves: it needs the foundation (and its public-subnet
  #  parameter), not the preflight, and nothing else waits for it.
  # ══════════════════════════════════════════════════════════════════════════
  deploy-ecs:
    name: Deploy ECS (admission-ctl, sse-server)
    needs: [resolve-env, quality-gate, deploy-foundation]
    if: >-
      always() &&
      needs.quality-gate.result == 'success' &&
      needs.deploy-foundation.result != 'failure' &&
      needs.resolve-env.outputs.ecs == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: The foundation must publish the public subnets
        env:
          ENV: ${{ needs.resolve-env.outputs.environment }}
        run: |
          set -euo pipefail
          if [ "$ENV" != "prod" ]; then
            echo "::error::Environment is '$ENV' but infra/ecs/template-cfn.yaml resolves /rusuh/prod/... by default."
            exit 1
          fi
          if ! aws ssm get-parameter --name "/rusuh/${ENV}/vpc/public-subnet-ids" >/dev/null 2>&1; then
            echo "::error::/rusuh/${ENV}/vpc/public-subnet-ids is missing. Deploy the foundation (workflow_dispatch with deploy_foundation=true)."
            exit 1
          fi
      - name: Deploy the image repositories
        env:
          ENV: ${{ needs.resolve-env.outputs.environment }}
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --template-file infra/ecs/ecr.yaml \
            --stack-name "rusuh-${ENV}-ecr" \
            --no-fail-on-empty-changeset \
            --parameter-overrides "Environment=${ENV}" \
            --tags Project=rusuh ManagedBy=github-actions
      - name: Build and push both images
        env:
          ENV: ${{ needs.resolve-env.outputs.environment }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="${account}.dkr.ecr.${REGION}.amazonaws.com"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$registry"
          for svc in admission-ctl sse-server; do
            image="${registry}/rusuh-${ENV}/${svc}:${GITHUB_SHA}"
            docker build -f "services/${svc}/Dockerfile" -t "$image" .
            docker push "$image"
          done
      - name: Deploy the ECS stack
        env:
          ENV: ${{ needs.resolve-env.outputs.environment }}
        run: |
          set -euo pipefail
          # CloudFormation waits for both services to reach a steady state, and the deployment circuit breaker rolls
          # a failing one back, so a bad image fails this step instead of passing silently.
          aws cloudformation deploy \
            --template-file infra/ecs/template-cfn.yaml \
            --stack-name "rusuh-${ENV}-ecs" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "Environment=${ENV}" \
              "ImageTag=${GITHUB_SHA}" \
              "MaxConcurrentSlots=${{ vars.MAX_CONCURRENT_SLOTS || '100' }}" \
            --tags Project=rusuh ManagedBy=github-actions
      - name: Smoke - the stream server answers on the load balancer
        env:
          ENV: ${{ needs.resolve-env.outputs.environment }}
        run: |
          set -euo pipefail
          url=$(aws cloudformation describe-stacks --stack-name "rusuh-${ENV}-ecs" \
            --query "Stacks[0].Outputs[?OutputKey=='StreamUrl'].OutputValue" --output text)
          echo "stream server: $url"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${url}/health" || echo 000)
            echo "attempt $i: /health -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::The stream server did not answer 200 on /health through the load balancer."
          exit 1

  # ══════════════════════════════════════════════════════════════════════════
  #  SMOKE TEST
  # ══════════════════════════════════════════════════════════════════════════
  smoke:
    name: Smoke test
    needs: [resolve-env, deploy-booking, deploy-queue, deploy-events, deploy-nik-verify, deploy-user, deploy-api-gateway, deploy-payment-api]
    if: >-
      always() &&
      needs.deploy-booking.result != 'failure' &&
      needs.deploy-queue.result != 'failure' &&
      needs.deploy-events.result != 'failure' &&
      needs.deploy-nik-verify.result != 'failure' &&
      needs.deploy-user.result != 'failure' &&
      needs.deploy-api-gateway.result != 'failure' &&
      needs.deploy-payment-api.result != 'failure' &&
      needs.resolve-env.outputs.any_service_changed == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: GET /sys/ping on unified API
        env:
          ENV: ${{ needs.resolve-env.outputs.environment }}
          DIRECT_ACCESS: ${{ vars.ENABLE_DIRECT_API_ACCESS || 'false' }}
        run: |
          set -euo pipefail
          
          # Test the unified API gateway (primary entry point)
          url=$(aws cloudformation describe-stacks --stack-name "rusuh-${ENV}-api" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text 2>/dev/null || true)
          
          if [ -n "$url" ] && [ "$url" != "None" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${url}/sys/ping" || echo 000)
            if [ "$code" = "200" ]; then
              echo "✓ unified-api /sys/ping -> 200"
            else
              echo "✗ unified-api /sys/ping -> $code"
              exit 1
            fi
          else
            echo "✗ Unified API stack not found"
            exit 1
          fi
          
          # Only test individual service endpoints if direct access is enabled
          if [ "$DIRECT_ACCESS" = "true" ]; then
            echo ""
            echo "Testing direct service endpoints (ENABLE_DIRECT_API_ACCESS=true)..."
            fail=0
            for svc in booking queue events nik-verify user payment-api; do
              url=$(aws cloudformation describe-stacks --stack-name "rusuh-${ENV}-${svc}" \
                --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
                --output text 2>/dev/null || true)
              if [ -z "$url" ] || [ "$url" = "None" ]; then
                echo "  skip  $svc (no direct endpoint)"
                continue
              fi
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${url}/sys/ping" || echo 000)
              if [ "$code" = "200" ]; then
                echo "  ✓ $svc -> 200"
              else
                echo "  ✗ $svc -> $code"
                fail=1
              fi
            done
            [ "$fail" -eq 0 ] || exit 1
          else
            echo ""
            echo "Direct service endpoints disabled (ENABLE_DIRECT_API_ACCESS=false)"
            echo "All traffic should go through the unified API."
          fi
