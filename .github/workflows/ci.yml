name: Golang CI/CD

on:
  push:
    branches: [ "main", "cicd" ]
  pull_request:
    branches: [ "main", "cicd" ]

# Cancel superseded runs on the same ref so rapid pushes don't stack deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Which modules changed? pkg fans out to every dependent service. ----
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set.outputs.modules }}
      booking: ${{ steps.filter.outputs.booking }}
      pkg: ${{ steps.filter.outputs.pkg }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            pkg:
              - 'pkg/**'
              - 'go.work'
            booking:
              - 'services/booking/**'
              - 'pkg/**'
              - 'go.work'
      - id: set
        # Build the module matrix. A pkg change forces BOTH modules (services vendor pkg).
        run: |
          mods=()
          if [ "${{ steps.filter.outputs.pkg }}" = "true" ]; then mods+=("pkg"); fi
          if [ "${{ steps.filter.outputs.booking }}" = "true" ]; then mods+=("services/booking"); fi
          if [ ${#mods[@]} -eq 0 ]; then mods+=("pkg" "services/booking"); fi   # fallback: run all
          json=$(printf '%s\n' "${mods[@]}" | jq -R . | jq -cs .)
          echo "modules=$json" >> "$GITHUB_OUTPUT"
          echo "matrix: $json"

  golangci-lint:
    name: Lint (${{ matrix.module }})
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.2.1
          working-directory: ${{ matrix.module }}
          args: --timeout=10m
        env:
          GOLANGCI_LINT_GO_VERSION_CHECK: "off"

  test:
    name: Test + Coverage (${{ matrix.module }})
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          check-latest: true
      - name: Build (isolation check — no workspace)
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: off
        run: go build ./...
      - name: Run tests with coverage
        working-directory: ${{ matrix.module }}
        run: go test -coverprofile=coverage.out ./...
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ strategy.job-index }}
          path: ${{ matrix.module }}/coverage.out
      - name: Check code coverage (80% gate)
        working-directory: ${{ matrix.module }}
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "Total coverage ($(basename ${{ matrix.module }})): $coverage%"
          awk -v c="$coverage" 'BEGIN { if (c+0 < 80) { print "Code coverage below threshold!"; exit 1 } }'

  govulncheck:
    name: Vuln Scan (${{ matrix.module }})
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          check-latest: true
      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: off
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  hadolint:
    name: Lint Dockerfiles
    needs: detect-changes
    if: needs.detect-changes.outputs.booking == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          recursive: true

  sonarqube:
    name: Sonarqube Checker
    needs: [golangci-lint, test, govulncheck]
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: ./coverage
          merge-multiple: true
      - name: SonarQube Scan (booking)
        uses: SonarSource/sonarqube-scan-action@2500896589ef8f7247069a56136f8dc177c27ccf # v5.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: services/booking
          args: >
            -Dsonar.go.coverage.reportPaths=../../coverage/coverage.out

  deploy-booking:
    name: Deploy booking → AWS Lambda (SAM)
    needs: [detect-changes, sonarqube]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.detect-changes.outputs.booking == 'true'
    permissions:
      id-token: write   # required for AWS OIDC
      contents: read
    defaults:
      run:
        working-directory: services/booking
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          check-latest: true
      - uses: aws-actions/setup-sam@819220f63fb333a9a394dd0a5cab2d8303fd3ca1 # v2.0.0
        with:
          use-installer: true
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: SAM build
        run: sam build
      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name rusuh-booking \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region ${{ vars.AWS_REGION }}
