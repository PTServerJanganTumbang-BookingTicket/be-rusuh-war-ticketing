name: Golang CI/CD

on:
  push:
    branches: [ "main", "cicd" ]
  pull_request:
    branches: [ "main", "cicd" ]

# Cancel superseded runs on the same ref so rapid pushes don't stack deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Which modules changed? pkg fans out to every dependent service. ----
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout
      pull-requests: read   # dorny/paths-filter needs this to list PR changed files
    outputs:
      modules: ${{ steps.set.outputs.modules }}
      booking: ${{ steps.filter.outputs.booking }}
      user: ${{ steps.filter.outputs.user }}
      nik_verify: ${{ steps.filter.outputs.nik_verify }}
      notification: ${{ steps.filter.outputs.notification }}
      outbox_publisher: ${{ steps.filter.outputs.outbox_publisher }}
      pkg: ${{ steps.filter.outputs.pkg }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            pkg:
              - 'pkg/**'
              - 'go.work'
            booking:
              - 'services/booking/**'
              - 'pkg/**'
              - 'go.work'
            user:
              - 'services/user/**'
              - 'pkg/**'
              - 'go.work'
            nik_verify:
              - 'services/nik-verify/**'
              - 'pkg/**'
              - 'go.work'
            notification:
              - 'services/notification/**'
              - 'pkg/**'
              - 'go.work'
            outbox_publisher:
              - 'services/outbox-publisher/**'
              - 'pkg/**'
              - 'go.work'
      - id: set
        # Build the module matrix. A pkg change forces ALL service modules.
        run: |
          mods=()
          if [ "${{ steps.filter.outputs.pkg }}" = "true" ]; then mods+=("pkg"); fi
          if [ "${{ steps.filter.outputs.booking }}" = "true" ]; then mods+=("services/booking"); fi
          if [ "${{ steps.filter.outputs.user }}" = "true" ]; then mods+=("services/user"); fi
          if [ "${{ steps.filter.outputs.nik_verify }}" = "true" ]; then mods+=("services/nik-verify"); fi
          if [ "${{ steps.filter.outputs.notification }}" = "true" ]; then mods+=("services/notification"); fi
          if [ "${{ steps.filter.outputs.outbox_publisher }}" = "true" ]; then mods+=("services/outbox-publisher"); fi
          if [ ${#mods[@]} -eq 0 ]; then mods+=("pkg" "services/booking" "services/user" "services/nik-verify" "services/notification" "services/outbox-publisher"); fi   # fallback: run all
          json=$(printf '%s\n' "${mods[@]}" | jq -R . | jq -cs .)
          echo "modules=$json" >> "$GITHUB_OUTPUT"
          echo "matrix: $json"

  golangci-lint:
    name: Lint (${{ matrix.module }})
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
          args: --timeout=10m
        env:
          GOLANGCI_LINT_GO_VERSION_CHECK: "off"

  test:
    name: Test + Coverage (${{ matrix.module }})
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          check-latest: true
      - name: Build (isolation check — no workspace)
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: off
        run: go build ./...
      - name: Run tests with coverage
        working-directory: ${{ matrix.module }}
        run: go test -coverprofile=coverage.out ./...
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ strategy.job-index }}
          path: ${{ matrix.module }}/coverage.out
      - name: Check code coverage (80% gate)
        working-directory: ${{ matrix.module }}
        # Gate on testable code only. Excluded from the denominator:
        #   cmd/    — func main() + process wiring, not unit-testable
        #   _mock/  — generated gomock code, never counts toward coverage
        # The full profile is still uploaded above for Sonar; only the gate drops these.
        run: |
          grep -vE '/(cmd|_mock)/' coverage.out > coverage.gate.out || cp coverage.out coverage.gate.out
          coverage=$(go tool cover -func=coverage.gate.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "Gate coverage ($(basename ${{ matrix.module }}), excl. cmd/ _mock/): $coverage%"
          awk -v c="$coverage" 'BEGIN { if (c+0 < 80) { print "Code coverage below threshold!"; exit 1 } }'

  govulncheck:
    name: Vuln Scan (${{ matrix.module }})
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          check-latest: true
      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: off
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  hadolint:
    name: Lint Dockerfiles
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.booking == 'true' ||
      needs.detect-changes.outputs.user == 'true' ||
      needs.detect-changes.outputs.nik_verify == 'true' ||
      needs.detect-changes.outputs.outbox_publisher == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          recursive: true

  deploy-booking:
    name: Deploy booking → AWS Lambda (SAM)
    needs: [detect-changes, golangci-lint, test, govulncheck]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.detect-changes.outputs.booking == 'true'
    permissions:
      id-token: write   # required for AWS OIDC
      contents: read
    defaults:
      run:
        working-directory: services/booking
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          check-latest: true
      - uses: aws-actions/setup-sam@819220f63fb333a9a394dd0a5cab2d8303fd3ca1 # v2.0.0
        with:
          use-installer: true
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: SAM build
        run: sam build
      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name rusuh-booking \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region ${{ vars.AWS_REGION }}

  deploy-user:
    name: Deploy user → AWS Lambda (SAM)
    needs: [detect-changes, golangci-lint, test, govulncheck]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.detect-changes.outputs.user == 'true'
    permissions:
      id-token: write   # required for AWS OIDC
      contents: read
    defaults:
      run:
        working-directory: services/user
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          check-latest: true
      - uses: aws-actions/setup-sam@819220f63fb333a9a394dd0a5cab2d8303fd3ca1 # v2.0.0
        with:
          use-installer: true
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: SAM build
        run: sam build
      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name rusuh-user \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region ${{ vars.AWS_REGION }}

  deploy-nik-verify:
    name: Deploy nik-verify → AWS Lambda (SAM)
    needs: [detect-changes, golangci-lint, test, govulncheck]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.detect-changes.outputs.nik_verify == 'true'
    permissions:
      id-token: write   # required for AWS OIDC
      contents: read
    defaults:
      run:
        working-directory: services/nik-verify
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          check-latest: true
      - uses: aws-actions/setup-sam@819220f63fb333a9a394dd0a5cab2d8303fd3ca1 # v2.0.0
        with:
          use-installer: true
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: SAM build
        run: sam build
      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name rusuh-nik-verify \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region ${{ vars.AWS_REGION }}

  deploy-notification:
    name: Deploy notification → AWS Lambda (SAM)
    needs: [detect-changes, golangci-lint, test, govulncheck]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.detect-changes.outputs.notification == 'true'
    permissions:
      id-token: write   # required for AWS OIDC
      contents: read
    defaults:
      run:
        working-directory: services/notification
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          check-latest: true
      - uses: aws-actions/setup-sam@819220f63fb333a9a394dd0a5cab2d8303fd3ca1 # v2.0.0
        with:
          use-installer: true
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: SAM build
        run: sam build
      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name rusuh-notification \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region ${{ vars.AWS_REGION }}

  deploy-outbox-publisher:
    name: Deploy outbox-publisher → AWS Lambda (SAM)
    # Also gated on deploy-notification: this stack takes the notification
    # queue's URL and ARN as parameters, so that stack has to exist first.
    needs: [detect-changes, golangci-lint, test, govulncheck, deploy-notification]
    runs-on: ubuntu-latest
    # always() keeps this running when deploy-notification was skipped because
    # nothing in that service changed; the queue already exists in that case.
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.detect-changes.outputs.outbox_publisher == 'true' &&
      needs.test.result == 'success' &&
      needs.deploy-notification.result != 'failure'
    permissions:
      id-token: write   # required for AWS OIDC
      contents: read
    defaults:
      run:
        working-directory: services/outbox-publisher
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          check-latest: true
      - uses: aws-actions/setup-sam@819220f63fb333a9a394dd0a5cab2d8303fd3ca1 # v2.0.0
        with:
          use-installer: true
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: SAM build
        run: sam build
      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name rusuh-outbox-publisher \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region ${{ vars.AWS_REGION }}
