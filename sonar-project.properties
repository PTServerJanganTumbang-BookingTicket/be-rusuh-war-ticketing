# Single SonarQube project for the whole monorepo (pkg + every service).
# CI scans once from the repo root; per-service properties files were merged here.
sonar.ci.autoconfig.disabled=true
sonar.organization=ptserverjangantumbang-bookingticket
sonar.projectKey=PTServerJanganTumbang-BookingTicket_be-rusuh-war-ticketing
sonar.projectName=be-rusuh-war-ticketing
sonar.qualitygate.wait=true

# Code vs tests (both live side by side in pkg/ and services/*).
sonar.sources=pkg,services
sonar.tests=pkg,services
sonar.exclusions=**/*_test.go,**/vendor/**
sonar.test.inclusions=**/*_test.go

# Coverage: one profile per module, uploaded by the CI test matrix into coverage/.
# CI overrides this with the exact file list; the default suits a local run.
sonar.go.coverage.reportPaths=coverage/coverage.out
sonar.coverage.exclusions=**/*_test.go,**/_mock/**,**/mock/**,**/mocks/**,**/vendor/**,**/*mock*,**/cmd/**

# Duplication: config, wiring, value objects, shared lib and email templates.
sonar.cpd.exclusions=**/internal/config/**,**/*_test.go,**/cmd/**/*.go,**/valueobject/**/*.go,**/pkg/**/*.go,**/template/**/*.go
