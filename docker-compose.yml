# Local dependencies for integration tests and `make verify`.
#   make deps-up      # docker compose up -d --wait
#   make deps-down    # docker compose down -v (stop and wipe)
#
# Redis runs in CLUSTER MODE (one node that owns all 16384 slots), so CROSSSLOT
# errors show up locally exactly as on ElastiCache. It announces the HOST address,
# so a cluster client on the host can follow CLUSTER SLOTS. Failover tests that
# need replicas will add a separate profile later.
#
# Host ports default to 16379 / 15432 so they never clash with a local Redis/Postgres.
# Override with REDIS_PORT / POSTGRES_PORT (and the same vars in the Makefile).
services:
  redis:
    image: redis:7.4-alpine
    # Keep every line at the SAME indent: YAML ">" keeps the newline before a
    # more-indented line, and the shell would then drop the flags on it.
    command: >
      sh -c "(until redis-cli ping >/dev/null 2>&1; do sleep 0.2; done;
      redis-cli cluster info | grep -q 'cluster_state:ok' || redis-cli cluster addslotsrange 0 16383) &
      exec redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-announce-ip 127.0.0.1 --cluster-announce-port ${REDIS_PORT:-16379}
      --appendonly no --save ''"
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli cluster info | grep -q 'cluster_state:ok'"]
      interval: 1s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rusuh
      POSTGRES_PASSWORD: rusuh-local-only
      POSTGRES_DB: rusuh
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rusuh -d rusuh"]
      interval: 1s
      timeout: 2s
      retries: 30
